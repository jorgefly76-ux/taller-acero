<style>

@media (prefers-color-scheme: dark){

.seg.p0{background:var(--accent)} .seg.p1{background:color-mix(in srgb,var(--accent) 72%,var(--ink))}
.barlab{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:3px;gap:8px}

.fig .d{stroke:var(--accent);stroke-width:1.5;fill:none}
.fig .g{stroke:var(--muted);stroke-width:1.2;stroke-dasharray:4 3;fill:none}

.mrow{grid-column:1/-1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}

@media (prefers-reduced-motion:no-preference){.view{animation:in .18s ease-out}@keyframes in{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}}

<script>
/*CALC-START*/
const RHO={acero:7850,inox304:8000,inox316:8000,alu:2700,cobre:8960,laton:8500,bronce:8800,fundicion:7200,titanio:4500,plomo:11340};
function crossArea(shape,p){
  const {w,h,t,d,s}=p;
  switch(shape){
    case 'flat': return w*t;
    case 'round': return Math.PI*d*d/4;
    case 'square': return s*s;
    case 'hex': return Math.sqrt(3)/2*s*s;
    case 'tube': return d>2*t ? Math.PI/4*(d*d-Math.pow(d-2*t,2)) : NaN;
    case 'rect': return (w>2*t && h>2*t) ? w*h-(w-2*t)*(h-2*t) : NaN;
    case 'angle': return t*(w+h-t);
  }
  return NaN;
}
function massPerM(shape,p,rho){return crossArea(shape,p)*1e-6*rho;}

function beamLoads(L,w,P){return {M:w*L*L/8+P*L/4, V:w*L/2+P/2};}
function beamDefl(L,w,P,I,E){E=E||210000;const Lm=L*1000;return 5*w*Math.pow(Lm,4)/(384*E*I)+P*1000*Math.pow(Lm,3)/(48*E*I);}
function beamCheck(sec,L,w,P,fy,limit,selfW){
  const q=w+(selfW?sec.mass*9.80665/1000:0);
  const {M,V}=beamLoads(L,q,P);
  const sigma=M*1e6/sec.W, uM=sigma/fy;
  const tau=sec.Av?V*1000/sec.Av:NaN, uV=tau/(fy/Math.sqrt(3));
  const d=beamDefl(L,q,P,sec.I), dl=L*1000/limit, uD=d/dl;
  return {q,M,V,sigma,uM,tau,uV,d,dl,uD,ok:uM<=1&&(isNaN(uV)||uV<=1)&&uD<=1};
}
const IPE=[ // nombre, h mm, tw mm, A cm2, Ix cm4, Wel,x cm3, masa kg/m
['IPE 80',80,3.8,7.64,80.1,20.0,6.0],['IPE 100',100,4.1,10.3,171,34.2,8.1],['IPE 120',120,4.4,13.2,318,53.0,10.4],
['IPE 140',140,4.7,16.4,541,77.3,12.9],['IPE 160',160,5.0,20.1,869,109,15.8],['IPE 180',180,5.3,23.9,1317,146,18.8],
['IPE 200',200,5.6,28.5,1943,194,22.4],['IPE 220',220,5.9,33.4,2772,252,26.2],['IPE 240',240,6.2,39.1,3892,324,30.7],
['IPE 270',270,6.6,45.9,5790,429,36.1],['IPE 300',300,7.1,53.8,8356,557,42.2],['IPE 330',330,7.5,62.6,11770,713,49.1],
['IPE 360',360,8.0,72.7,16270,904,57.1],['IPE 400',400,8.6,84.5,23130,1156,66.3]];
function ipeSec(r){return {I:r[4]*1e4,W:r[5]*1e3,Av:r[1]*r[2],mass:r[6]};}

const FEXX={E60:414,E70:483,E80:552};
function minLeg(t){return t<=6.35?3:t<=12.7?5:t<=19.05?6:8;}
function weld(leg,len,fexx,eff,load){
  const throat=leg*Math.SQRT1_2, area=leg*leg/2;
  const kgPerM=area*1e-6*7850, kg=kgPerM*len/1000;
  const phi=0.75*0.6*fexx*throat;       // N/mm, LRFD
  const asd=0.6*fexx*throat/2;          // N/mm, ASD
  return {throat,area,kgPerM,kg,consum:kg/eff,phi,asd,phiTot:phi*len/1000,asdTot:asd*len/1000,
    reqLeg:load>0?load*1000/(len*0.75*0.6*fexx*Math.SQRT1_2):NaN};
}

const UTS={acero:400,inox:600,alu5052:230,alu6061:310,cobre:220,laton:340};
function vDie(t){return Math.round(t<=2.5?6*t:t<=8?8*t:t<=10?10*t:12*t);}
function bend(t,uts,ang,len,V,r,K,A,B){
  V=V>0?V:vDie(t); r=r>0?r:0.16*V;
  const th=ang*Math.PI/180;
  const Fm=1.42*uts*t*t/V;               // kN por metro
  const BA=th*(r+K*t), oss=(r+t)*Math.tan(th/2), BD=2*oss-BA;
  return {V,r,Fm,tf_m:Fm/9.80665,tfTot:Fm*len/1000/9.80665,minFlange:0.7*V,BA,BD,flat:A+B-BD};
}

function offsetCalc(hor,ver,ang,R){
  const off=Math.hypot(hor,ver), a=ang*Math.PI/180;
  const travel=off/Math.sin(a), run=off/Math.tan(a), take=R>0?R*Math.tan(a/2):0;
  return {off,travel,run,mult:1/Math.sin(a),take,cut:travel-2*take};
}
function pcd(n,D,start){
  const r=D/2;
  return Array.from({length:n},(_,i)=>{const a=start+360*i/n, rad=a*Math.PI/180;
    return {i:i+1,a:((a%360)+360)%360,x:r*Math.cos(rad),y:r*Math.sin(rad)};});
}
function tri(a,b,c,A){
  const ok=v=>isFinite(v)&&v>0, R=Math.PI/180;
  if(ok(a)&&ok(b)){c=Math.hypot(a,b);A=Math.atan2(a,b)/R;}
  else if(ok(a)&&ok(c)){if(c<=a)return null;b=Math.sqrt(c*c-a*a);A=Math.asin(a/c)/R;}
  else if(ok(b)&&ok(c)){if(c<=b)return null;a=Math.sqrt(c*c-b*b);A=Math.acos(b/c)/R;}
  else if(ok(A)&&A<90&&ok(a)){b=a/Math.tan(A*R);c=a/Math.sin(A*R);}
  else if(ok(A)&&A<90&&ok(b)){a=b*Math.tan(A*R);c=b/Math.cos(A*R);}
  else if(ok(A)&&A<90&&ok(c)){a=c*Math.sin(A*R);b=c*Math.cos(A*R);}
  else return null;
  return {a,b,c,A,B:90-A};
}
function segArea(r,h){
  h=Math.max(0,Math.min(2*r,h)); if(h<=0)return 0; if(h>=2*r)return Math.PI*r*r;
  return r*r*Math.acos((r-h)/r)-(r-h)*Math.sqrt(2*r*h-h*h);
}
function tank(type,p){
  let total,fill;
  if(type==='v'){const A=Math.PI*p.d*p.d/4;total=A*p.h;fill=A*Math.min(p.level,p.h);}
  else if(type==='h'){const r=p.d/2;total=Math.PI*r*r*p.h;fill=segArea(r,p.level)*p.h;}
  else{const A=p.w*p.l;total=A*p.h;fill=A*Math.min(p.level,p.h);}
  return {total:total/1e6,fill:fill/1e6};
}
function packCuts(stock,kerf,pieces){
  const sorted=pieces.slice().sort((a,b)=>b-a), bars=[];
  for(const p of sorted){
    let placed=false;
    for(const b of bars){
      const need=b.used+kerf+p;
      if(need<=stock+1e-9){b.items.push(p);b.used=need;placed=true;break;}
    }
    if(!placed)bars.push({items:[p],used:p});
  }
  return bars;
}
const UNITS={
  'Longitud':{base:'m',u:{mm:.001,cm:.01,m:1,km:1000,'pulg (in)':.0254,'pie (ft)':.3048,'yarda (yd)':.9144}},
  'Masa':{u:{g:.001,kg:1,'t (métrica)':1000,'libra (lb)':.45359237,'onza (oz)':.028349523125}},
  'Presión / tensión':{u:{Pa:1,kPa:1e3,MPa:1e6,bar:1e5,psi:6894.757293,ksi:6894757.293,'kgf/cm²':98066.5}},
  'Fuerza':{u:{N:1,kN:1000,kgf:9.80665,'lbf':4.4482216,'tonf (métrica)':9806.65}},
  'Par (torque)':{u:{'N·m':1,'kgf·m':9.80665,'lbf·ft':1.3558179,'lbf·in':.1129848}},
  'Área':{u:{'mm²':1e-6,'cm²':1e-4,'m²':1,'in²':6.4516e-4,'ft²':.09290304}},
  'Volumen':{u:{mL:.001,L:1,'m³':1000,'gal EE.UU.':3.785411784,'gal imp.':4.54609}}
};
function convert(cat,val,from){
  const u=UNITS[cat].u, base=val*u[from], out={};
  for(const k in u)out[k]=base/u[k];
  return out;
}

function stair(H,riserTarget,Lav){
  const n=Math.max(1,Math.round(H/riserTarget));
  const h=H/n, treads=n-1;
  const pp=(Lav>0&&treads>0)?Lav/treads:630-2*h;
  const run=treads*pp;
  return {n,h,treads,p:pp,run,ang:Math.atan2(h,pp)*180/Math.PI,zanca:Math.hypot(H,run),paso:2*h+pp};
}
function dimsFor(shape,a,b,c){
  switch(shape){
    case 'flat':return {w:a,t:b};
    case 'round':return {d:a};
    case 'square':case 'hex':return {s:a};
    case 'tube':return {d:a,t:b};
    default:return {w:a,h:b,t:c};
  }
}
function lineKg(shape,a,b,c,L,q,rho){return massPerM(shape,dimsFor(shape,a,b,c),rho)*L/1000*q;}
/*CALC-END*/

/* ---------- utilidades de interfaz ---------- */
const $=(s,r)=>(r||document).querySelector(s);
const $$=(s,r)=>Array.from((r||document).querySelectorAll(s));
const N=id=>{const e=document.getElementById(id);if(!e)return NaN;const v=parseFloat(String(e.value).replace(',','.'));return isFinite(v)?v:NaN;};
const V=id=>document.getElementById(id).value;
const fmt=(n,d)=>isFinite(n)?n.toLocaleString('es-AR',{maximumFractionDigits:d==null?2:d}):'—';
const fld=(id,label,val,unit,grp,cls)=>`<label class="f ${cls||''}" for="${id}"${grp?` data-g="${grp}"`:''}><span id="lab-${id}">${label}</span><div class="in"><input id="${id}" type="text" inputmode="decimal" autocomplete="off" value="${val}">${unit?`<em>${unit}</em>`:''}</div></label>`;
const sel=(id,label,opts,val,grp,cls)=>`<label class="f ${cls||''}" for="${id}"${grp?` data-g="${grp}"`:''}><span>${label}</span><div class="in"><select id="${id}">${opts.map(o=>`<option value="${o[0]}"${String(o[0])===String(val)?' selected':''}>${o[1]}</option>`).join('')}</select></div></label>`;
const row=(label,value,unit,cls)=>`<div class="r ${cls||''}"><span>${label}</span><b>${value}${unit?`<small>${unit}</small>`:''}</b></div>`;
const utilRow=(label,u,detail)=>{const c=!isFinite(u)?'':u>1?'bad':u>.85?'warn':'good';
  return `<div class="r u ${c}"><div class="top2"><span>${label}</span><b>${isFinite(u)?fmt(u*100,0)+' %':'—'}<small>${detail||''}</small></b></div><span class="util"><i class="${c}" style="width:${isFinite(u)?Math.min(100,u*100):0}%"></i></span></div>`;};
const res=h=>`<div class="res">${h}</div>`;
const need='<p class="msg">Completá los datos para ver el resultado.</p>';
const ok=(...a)=>a.every(x=>isFinite(x));
const pos=(...a)=>a.every(x=>isFinite(x)&&x>0);

/* ---------- herramientas ---------- */
const ICON={
  peso:'<path d="M7 20h10l-1.6-9H8.6z"/><circle cx="12" cy="7" r="2.4"/>',
  viga:'<path d="M5 5h14M5 19h14M12 5v14"/>',
  suelda:'<path d="M5 5v14h14z"/>',
  plegado:'<path d="M3 18h9l7-9"/><path d="M12 18l3.5-.5"/>',

{id:'peso',name:'Peso de materiales',desc:'Chapa, barra, caño, perfil L',

 html:()=>`<div class="form">

  ${sel('shape','Forma',[['flat','Chapa / planchuela'],['round','Barra redonda'],['square','Barra cuadrada'],['hex','Barra hexagonal'],['tube','Caño redondo'],['rect','Caño rectangular'],['angle','Perfil L (ángulo)']],'flat','','full')}
  ${fld('w','Ancho','100','mm')}${fld('h','Alto','100','mm')}${fld('t','Espesor','10','mm')}${fld('d','Diámetro','50','mm')}${fld('s','Lado','30','mm')}${fld('l','Largo','1000','mm')}
  ${fld('qty','Cantidad','1','u.')}${fld('price','Precio por kg (opcional)','','$')}
  <p class="hint">Los caños y perfiles se calculan con esquinas vivas, sin radios de laminado.</p></div><div id="out"></div>`,
 calc(){
  const LAB={flat:{w:'Ancho',t:'Espesor',l:'Largo'},round:{d:'Diámetro',l:'Largo'},square:{s:'Lado',l:'Largo'},hex:{s:'Entre caras',l:'Largo'},tube:{d:'Diámetro exterior',t:'Espesor de pared',l:'Largo'},rect:{w:'Ancho',h:'Alto',t:'Espesor de pared',l:'Largo'},angle:{w:'Ala A',h:'Ala B',t:'Espesor',l:'Largo'}};
  const shape=V('shape'), lab=LAB[shape];
  ['w','h','t','d','s','l'].forEach(k=>{const el=document.getElementById(k).closest('.f');el.hidden=!(k in lab);if(k in lab)document.getElementById('lab-'+k).textContent=lab[k];});
  const p={w:N('w'),h:N('h'),t:N('t'),d:N('d'),s:N('s')}, L=N('l'), q=N('qty')||1, rho=RHO[V('mat')];
  const need2=Object.keys(lab).filter(k=>k!=='l').map(k=>p[k]);
  if(!pos(L,...need2)) return $('#out').innerHTML=need;
  const A=crossArea(shape,p);
  if(!isFinite(A)||A<=0) return $('#out').innerHTML='<p class="msg">El espesor de pared es demasiado grande para esa medida.</p>';
  const pm=A*1e-6*rho, piece=pm*L/1000, total=piece*q, price=N('price');
  $('#out').innerHTML=res(
    row('Peso total',fmt(total,2),'kg','key')+
    row('Peso por metro',fmt(pm,3),'kg/m')+
    row('Peso por pieza',fmt(piece,3),'kg')+
    row('Peso total en libras',fmt(total*2.20462262,2),'lb')+
    row('Área de la sección',fmt(A,1),'mm²')+
    (shape==='flat'?row('Superficie de una cara (por pieza)',fmt(p.w*L/1e6,3),'m²'):'')+
    (price>0?row('Costo del material',fmt(total*price,2),'$'):'')
  );
 }},

{id:'mats',name:'Lista de materiales',desc:'Peso y costo de una obra',

  const n=matN||(+store('mats').mrows)||3; matN=n;

  const rows=Array.from({length:n},(_,i)=>{const d=dflt[i]||['flat','','','','',''];
    return `<div class="mrow"><h3 class="sec" style="margin:0">Pieza ${i+1}</h3>

    ${fld('m'+i+'l','Largo',d[4],'mm')}${fld('m'+i+'q','Cantidad',d[5],'u.')}</div>`;}).join('');

  </div><div id="out"></div>`;},
 calc(){
  const n=matN||3, LAB={flat:['Ancho','Espesor'],round:['Diámetro'],square:['Lado'],hex:['Entre caras'],tube:['Diámetro exterior','Pared'],rect:['Ancho','Alto','Pared'],angle:['Ala A','Ala B','Espesor']};

    const a=N('m'+i+'a'),b=N('m'+i+'b'),c=N('m'+i+'c'),L=N('m'+i+'l'),q=N('m'+i+'q');
    const dims=[a,b,c].slice(0,lab.length);

    const kg=lineKg(sh,a,b,c,L,q,rho);
    if(isFinite(kg)&&kg>0){net+=kg;lines.push(row(`Pieza ${i+1}: ${names[sh]}, ${fmt(q,0)} × ${fmt(L,0)} mm`,fmt(kg,2),'kg'));}

 }},

{id:'viga',name:'Viga apoyada',desc:'Flexión, corte y flecha',
 fig:()=>FIG.viga(),
 html:()=>`<div class="form">
  ${sel('sec','Sección',IPE.map((r,i)=>[i,r[0]]).concat([['rect','Rectangular maciza'],['round','Redonda maciza'],['tubeR','Caño redondo'],['custom','Propiedades propias']]),6,'','full')}
  ${fld('sb','Base b','50','mm','rect')}${fld('sh','Alto h','100','mm','rect')}${fld('sd','Diámetro','40','mm','round')}
  ${fld('sD','Diámetro exterior','88.9','mm','tubeR')}${fld('st','Espesor de pared','4','mm','tubeR')}
  ${fld('cI','Inercia Ix','1943','cm⁴','custom')}${fld('cW','Módulo resistente Wx','194','cm³','custom')}${fld('cm','Masa','22.4','kg/m','custom')}${fld('cAv','Área de corte (opcional)','','cm²','custom')}
  <h3 class="sec">Cargas y condiciones</h3>
  ${fld('L','Luz entre apoyos','4','m')}${fld('w','Carga distribuida','10','kN/m')}
  ${fld('P','Carga puntual al centro','0','kN')}${sel('fy','Acero',[[235,'S235 (235 MPa)'],[275,'S275 (275 MPa)'],[355,'S355 (355 MPa)']],235)}
  ${sel('lim','Flecha admisible',[[250,'L/250'],[300,'L/300'],[360,'L/360'],[400,'L/400'],[500,'L/500']],300)}${sel('sw','Peso propio',[[1,'Sumarlo'],[0,'Ya incluido']],1)}
  <p class="hint">Cargas de servicio, sin mayorar. Se compara la tensión con el límite elástico. No incluye pandeo lateral ni abolladura.</p></div><div id="out"></div>`,
 calc(){
  const s=V('sec'); $$('[data-g]').forEach(e=>e.hidden=e.dataset.g!==(isNaN(+s)?s:'none'));
  let sec=null, name='';
  if(!isNaN(+s)){sec=ipeSec(IPE[+s]);name=IPE[+s][0];}
  else if(s==='rect'){const b=N('sb'),h=N('sh');if(pos(b,h))sec={I:b*h*h*h/12,W:b*h*h/6,Av:b*h,mass:b*h*1e-6*7850};}
  else if(s==='round'){const d=N('sd');if(pos(d))sec={I:Math.PI*Math.pow(d,4)/64,W:Math.PI*d*d*d/32,Av:Math.PI*d*d/4,mass:Math.PI*d*d/4*1e-6*7850};}
  else if(s==='tubeR'){const D=N('sD'),t=N('st');if(pos(D,t)&&D>2*t){const dd=D-2*t,A=Math.PI/4*(D*D-dd*dd);sec={I:Math.PI/64*(Math.pow(D,4)-Math.pow(dd,4)),W:Math.PI/32*(Math.pow(D,4)-Math.pow(dd,4))/D,Av:2*A/Math.PI,mass:A*1e-6*7850};}}
  else if(s==='custom'){const I=N('cI'),W=N('cW'),m=N('cm'),av=N('cAv');if(pos(I,W,m))sec={I:I*1e4,W:W*1e3,Av:av>0?av*100:0,mass:m};}
  const L=N('L'),w=N('w')||0,P=N('P')||0,fy=+V('fy'),lim=+V('lim'),sw=V('sw')==='1';
  if(!sec||!pos(L)||(w<=0&&P<=0)) return $('#out').innerHTML=need;
  const c=beamCheck(sec,L,w,P,fy,lim,sw);
  let best='';
  if(!isNaN(+s)){const f=IPE.find(r=>beamCheck(ipeSec(r),L,w,P,fy,lim,sw).ok);best=f?f[0]:'ninguno de la lista';}
  $('#out').innerHTML=res(

    utilRow('Flexión',c.uM,`${fmt(c.sigma,0)} / ${fy} MPa`)+
    utilRow('Corte',c.uV,isFinite(c.tau)?`${fmt(c.tau,0)} MPa`:'sin dato')+
    utilRow('Flecha',c.uD,`${fmt(c.d,1)} de ${fmt(c.dl,1)} mm`)+
    row('Momento máximo',fmt(c.M,2),'kN·m')+
    row('Reacción en cada apoyo',fmt(c.V,2),'kN')+
    row('Carga distribuida total',fmt(c.q,3),'kN/m')+
    row('Relación luz / flecha','L/'+fmt(c.d>0?L*1000/c.d:Infinity,0))+
    (best?row('IPE más liviano que cumple',best,''):'')
  );
 }},

  ${sel('pr','Proceso (rendimiento)',[[.6,'Electrodo revestido ~60 %'],[.85,'FCAW tubular ~85 %'],[.93,'MIG/MAG sólido ~93 %'],[.98,'TIG ~98 %']],.6)}
  ${fld('tm','Espesor de la chapa más gruesa','10','mm')}${fld('ld','Carga a transmitir (opcional)','','kN')}
  <p class="hint">Resistencia según AISC 360 (LRFD y ASD) para carga de corte en el filete. Sin refuerzo de cordón en el cálculo del metal depositado.</p></div><div id="out"></div>`,
 calc(){
  const leg=N('leg'),len=N('len'),tm=N('tm'),ld=N('ld');

  $('#out').innerHTML=res(

    row('Admisible (ASD)',fmt(r.asdTot,1),'kN')+
    row('Resistencia por mm de cordón',fmt(r.phi,0),'N/mm')+
    row('Garganta efectiva',fmt(r.throat,2),'mm')+
    row('Metal depositado',fmt(r.kgPerM,3),'kg/m')+

    row('Consumible necesario',fmt(r.consum,3),'kg')+
    (isFinite(ml)?row('Cateto mínimo según espesor',ml,'mm',leg<ml?'warn':''):'')+

  );
 }},

{id:'pcd',name:'Agujeros en círculo (PCD)',desc:'Coordenadas y cuerda',
 fig:()=>FIG.pcd(),
 html:()=>`<div class="form">
  ${fld('pn','Cantidad de agujeros','6','')}${fld('pd','Diámetro del círculo (PCD)','100','mm')}
  ${fld('ps','Ángulo del primer agujero','0','°')}${fld('pdec','Decimales','3','')}</div><div id="out"></div>`,
 calc(){
  const n=Math.round(N('pn')),D=N('pd'),st=N('ps')||0,dec=Math.min(6,Math.max(0,Math.round(N('pdec')||3)));
  if(!(n>=2&&n<=360)||!pos(D)) return $('#out').innerHTML=need;
  const pts=pcd(n,D,st), ch=D*Math.sin(Math.PI/n), z=x=>Math.abs(x)<1e-9?0:x;
  $('#out').innerHTML=res(
    row('Distancia entre agujeros vecinos',fmt(ch,dec),'mm','key')+
    row('Separación angular',fmt(360/n,3),'°')+
    row('Radio',fmt(D/2,dec),'mm')
  )+`<div class="res" style="margin-top:12px"><div class="tblw"><table><thead><tr><th>N.º</th><th>Ángulo</th><th>X (mm)</th><th>Y (mm)</th></tr></thead><tbody>${
    pts.map(p=>`<tr><td>${p.i}</td><td>${fmt(p.a,2)}°</td><td>${fmt(z(p.x),dec)}</td><td>${fmt(z(p.y),dec)}</td></tr>`).join('')}</tbody></table></div></div><p class="note">Coordenadas con origen en el centro del círculo. X hacia la derecha, Y hacia arriba.</p>`;
 }},

{id:'angulo',name:'Ángulos y pendientes',desc:'Triángulo, pendiente, inglete',

  const sv=N('sv'),k=V('sk');let deg=NaN;

    $('#sout').innerHTML=res(row('Grados',fmt(deg,3),'°')+row('Porcentaje',fmt(t*100,3),'%')+row('Milímetros por metro',fmt(t*1000,2),'mm/m')+row('Relación',t>0?'1 : '+fmt(1/t,2):'—'));
  }else $('#sout').innerHTML='';

  if(ja>0&&ja<180)h+=row('Corte de cada pieza, desde el eje',fmt(ja/2,3),'°')+row('Corte de cada pieza, desde escuadra',fmt(90-ja/2,3),'°');
  $('#iout').innerHTML=h?res(h):'';
 }},

{id:'tanque',name:'Capacidad de tanque',desc:'Volumen total y por nivel',
 fig:()=>FIG.tanque(V('tt')),
 html:()=>`<div class="form">
  ${sel('tt','Tipo de tanque',[['v','Cilíndrico vertical'],['h','Cilíndrico horizontal'],['r','Rectangular']],'v','','full')}
  ${fld('kd','Diámetro','1000','mm','v h')}${fld('kw','Ancho','1000','mm','r')}${fld('kl','Largo','1000','mm','r')}
  ${fld('kh','Altura','1500','mm','v r')}${fld('kL','Largo del cilindro','2000','mm','h')}
  ${fld('kn','Nivel del líquido (desde el fondo)','750','mm')}${fld('kr','Densidad del líquido','1','kg/L')}</div><div id="out"></div>`,
 calc(){
  const t=V('tt'); $$('[data-g]').forEach(e=>e.hidden=!e.dataset.g.split(' ').includes(t));
  const p={d:N('kd'),w:N('kw'),l:N('kl'),h:t==='h'?N('kL'):N('kh'),level:N('kn')}, rho=N('kr')||1;
  const dims=t==='r'?[p.w,p.l,p.h]:[p.d,p.h];
  if(!pos(...dims)||!ok(p.level)||p.level<0) return $('#out').innerHTML=need;
  const maxLevel=t==='h'?p.d:p.h;
  const r=tank(t,p), lv=Math.min(p.level,maxLevel);
  $('#out').innerHTML=res(
    row('Capacidad total',fmt(r.total,1),'L','key')+
    row('Volumen con ese nivel',fmt(r.fill,1),'L')+
    row('Llenado',fmt(r.fill/r.total*100,1),'%')+
    row('Volumen libre',fmt(r.total-r.fill,1),'L')+
    row('Capacidad total en m³',fmt(r.total/1000,3),'m³')+
    row('Masa del líquido',fmt(r.fill*rho,1),'kg')
  )+(p.level>maxLevel?'<p class="note">El nivel supera la altura útil; se tomó el tanque lleno.</p>':'');
 }},

{id:'corte',name:'Lista de corte',desc:'Barras necesarias y sobrante',
 fig:()=>FIG.corte(),
 html:()=>`<div class="form">
  ${fld('cs','Largo de la barra','6000','mm')}${fld('ck','Espesor del corte (disco)','3','mm')}
  <label class="f full" for="cp"><span>Piezas: largo × cantidad, una por línea</span><div class="in"><textarea id="cp" spellcheck="false">1200 x 4
850 x 6
430 x 8
2100 x 2</textarea></div></label></div><div id="out"></div>`,
 calc(){
  const S=N('cs'),k=N('ck')||0, pieces=[], bad=[];
  V('cp').split('\n').forEach(line=>{
    if(!line.trim())return;
    const m=line.trim().match(/^([\d.,]+)\s*(?:[x×*]\s*(\d+))?$/i);
    if(!m){bad.push(line.trim());return;}
    const len=parseFloat(m[1].replace(',','.')), q=Math.min(500,m[2]?+m[2]:1);
    if(!(len>0)){bad.push(line.trim());return;}
    for(let i=0;i<q;i++)pieces.push(len);
  });
  if(!pos(S)||!pieces.length) return $('#out').innerHTML=need;
  const big=pieces.filter(p=>p>S);
  if(big.length) return $('#out').innerHTML=`<p class="msg">Hay piezas más largas que la barra (${fmt(Math.max(...big),0)} mm).</p>`;
  const bars=packCuts(S,k,pieces), used=pieces.reduce((a,b)=>a+b,0), mat=bars.length*S;
  $('#out').innerHTML=res(
    row('Barras necesarias',bars.length,'u.','key')+
    row('Piezas a cortar',pieces.length,'u.')+
    row('Aprovechamiento',fmt(used/mat*100,1),'%')+
    row('Sobrante total',fmt(mat-used,0),'mm')
  )+`<div class="bars">${bars.map((b,i)=>`<div><div class="barlab"><span>Barra ${i+1}</span><span>sobrante ${fmt(S-b.used,0)} mm</span></div><div class="bar">${b.items.map((x,j)=>`<span class="seg p${j%2}" style="width:${x/S*100}%">${fmt(x,0)}</span>`).join('')}</div></div>`).join('')}</div>`+
  (bad.length?`<p class="note">No se entendió: ${bad.join(' | ')}</p>`:'');
 }},

{id:'conv',name:'Conversor de unidades',desc:'Longitud, presión, fuerza, par',

/* ---------- navegación ---------- */
const main=$('#main'), back=$('#back'), brand=$('#brand');
const MEM={};
function store(id){if(MEM[id])return MEM[id];try{return JSON.parse(localStorage.getItem('ta:'+id)||'{}');}catch(e){return {};}}
function save(id){const o=Object.assign({},store(id));$$('#main input,#main select,#main textarea').forEach(e=>{if(e.id)o[e.id]=e.value;});persist(id,o);}
function home(){
  document.title='Taller Acero';
  back.hidden=true; brand.hidden=false;
  main.className='view';
  main.innerHTML=`<p class="lead">${TOOLS.length} calculadoras para el taller y la obra. Funcionan sin conexión y no piden registro.</p><div class="grid">${TOOLS.map(t=>`<a class="tile" href="#${t.id}"><svg viewBox="0 0 24 24" aria-hidden="true">${ICON[t.id==='conv'?'conv':t.id]}</svg><h2>${t.name}</h2><p>${t.desc}</p></a>`).join('')}</div>`;
  window.scrollTo(0,0);
}
function openTool(t){
  document.title=t.name+' · Taller Acero';
  back.hidden=false; brand.hidden=true;
  main.className='view';
  main.innerHTML=`<h1 class="tt">${t.name}</h1><p class="sub">${t.desc}</p>`+(t.fig?'<figure class="fig" id="fig"></figure>':'')+t.html();
  const saved=store(t.id);
  Object.keys(saved).forEach(k=>{const e=document.getElementById(k);if(e&&!(e.tagName==='SELECT'&&!Array.from(e.options).some(o=>o.value===saved[k])&&e.options.length))e.value=saved[k];});
  const run=()=>{if(t.fig){try{$('#fig').innerHTML=t.fig();}catch(e){}}try{t.calc();}catch(e){$('#out').innerHTML='<p class="msg">No se pudo calcular con esos datos.</p>';}};
  main.oninput=main.onchange=()=>{run();save(t.id);};
  run();
  window.scrollTo(0,0);
}
function route(){
  const id=location.hash.replace('#','');
  const t=TOOLS.find(x=>x.id===id);
  t?openTool(t):home();
}
back.addEventListener('click',()=>{location.hash='';});
window.addEventListener('hashchange',route);
route();
</script>
<script>
if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>
