<script>
/*CALC-START*/
const RHO={acero:7850,inox304:8000,inox316:8000,alu:2700,cobre:8960,laton:8500,bronce:8800,fundicion:7200,titanio:4500,plomo:11340};
function crossArea(shape,p){
  const {w,h,t,d,s}=p;
  switch(shape){
    case 'flat': return w*t;
    case 'round': return Math.PI*d*d/4;
    case 'square': return s*s;
    case 'hex': return Math.sqrt(3)/2*s*s;
    case 'tube': return d>2*t ? Math.PI/4*(d*d-Math.pow(d-2*t,2)) : NaN;
    case 'rect': return (w>2*t && h>2*t) ? w*h-(w-2*t)*(h-2*t) : NaN;
    case 'angle': return t*(w+h-t);
  }
  return NaN;
}
function massPerM(shape,p,rho){return crossArea(shape,p)*1e-6*rho;}

function beamLoads(L,w,P){return {M:w*L*L/8+P*L/4, V:w*L/2+P/2};}
function beamDefl(L,w,P,I,E){E=E||210000;const Lm=L*1000;return 5*w*Math.pow(Lm,4)/(384*E*I)+P*1000*Math.pow(Lm,3)/(48*E*I);}
function beamCheck(sec,L,w,P,fy,limit,selfW){
  const q=w+(selfW?sec.mass*9.80665/1000:0);
  const {M,V}=beamLoads(L,q,P);
  const sigma=M*1e6/sec.W, uM=sigma/fy;
  const tau=sec.Av?V*1000/sec.Av:NaN, uV=tau/(fy/Math.sqrt(3));
  const d=beamDefl(L,q,P,sec.I), dl=L*1000/limit, uD=d/dl;
  return {q,M,V,sigma,uM,tau,uV,d,dl,uD,ok:uM<=1&&(isNaN(uV)||uV<=1)&&uD<=1};
}
const IPE=[ // nombre, h mm, tw mm, A cm2, Ix cm4, Wel,x cm3, masa kg/m
['IPE 80',80,3.8,7.64,80.1,20.0,6.0],['IPE 100',100,4.1,10.3,171,34.2,8.1],['IPE 120',120,4.4,13.2,318,53.0,10.4],
['IPE 140',140,4.7,16.4,541,77.3,12.9],['IPE 160',160,5.0,20.1,869,109,15.8],['IPE 180',180,5.3,23.9,1317,146,18.8],
['IPE 200',200,5.6,28.5,1943,194,22.4],['IPE 220',220,5.9,33.4,2772,252,26.2],['IPE 240',240,6.2,39.1,3892,324,30.7],
['IPE 270',270,6.6,45.9,5790,429,36.1],['IPE 300',300,7.1,53.8,8356,557,42.2],['IPE 330',330,7.5,62.6,11770,713,49.1],
['IPE 360',360,8.0,72.7,16270,904,57.1],['IPE 400',400,8.6,84.5,23130,1156,66.3]];
function ipeSec(r){return {I:r[4]*1e4,W:r[5]*1e3,Av:r[1]*r[2],mass:r[6]};}

const FEXX={E60:414,E70:483,E80:552};
function minLeg(t){return t<=6.35?3:t<=12.7?5:t<=19.05?6:8;}
function weld(leg,len,fexx,eff,load){
  const throat=leg*Math.SQRT1_2, area=leg*leg/2;
  const kgPerM=area*1e-6*7850, kg=kgPerM*len/1000;
  const phi=0.75*0.6*fexx*throat;       // N/mm, LRFD
  const asd=0.6*fexx*throat/2;          // N/mm, ASD
  return {throat,area,kgPerM,kg,consum:kg/eff,phi,asd,phiTot:phi*len/1000,asdTot:asd*len/1000,
    reqLeg:load>0?load*1000/(len*0.75*0.6*fexx*Math.SQRT1_2):NaN};
}

const UTS={acero:400,inox:600,alu5052:230,alu6061:310,cobre:220,laton:340};
function vDie(t){return Math.round(t<=2.5?6*t:t<=8?8*t:t<=10?10*t:12*t);}
function bend(t,uts,ang,len,V,r,K,A,B){
  V=V>0?V:vDie(t); r=r>0?r:0.16*V;
  const th=ang*Math.PI/180;
  const Fm=1.42*uts*t*t/V;               // kN por metro
  const BA=th*(r+K*t), oss=(r+t)*Math.tan(th/2), BD=2*oss-BA;
  return {V,r,Fm,tf_m:Fm/9.80665,tfTot:Fm*len/1000/9.80665,minFlange:0.7*V,BA,BD,flat:A+B-BD};
}

function offsetCalc(hor,ver,ang,R){
  const off=Math.hypot(hor,ver), a=ang*Math.PI/180;
  const travel=off/Math.sin(a), run=off/Math.tan(a), take=R>0?R*Math.tan(a/2):0;
  return {off,travel,run,mult:1/Math.sin(a),take,cut:travel-2*take};
}
function pcd(n,D,start){
  const r=D/2;
  return Array.from({length:n},(_,i)=>{const a=start+360*i/n, rad=a*Math.PI/180;
    return {i:i+1,a:((a%360)+360)%360,x:r*Math.cos(rad),y:r*Math.sin(rad)};});
}
function tri(a,b,c,A){
  const ok=v=>isFinite(v)&&v>0, R=Math.PI/180;
  if(ok(a)&&ok(b)){c=Math.hypot(a,b);A=Math.atan2(a,b)/R;}
  else if(ok(a)&&ok(c)){if(c<=a)return null;b=Math.sqrt(c*c-a*a);A=Math.asin(a/c)/R;}
  else if(ok(b)&&ok(c)){if(c<=b)return null;a=Math.sqrt(c*c-b*b);A=Math.acos(b/c)/R;}
  else if(ok(A)&&A<90&&ok(a)){b=a/Math.tan(A*R);c=a/Math.sin(A*R);}
  else if(ok(A)&&A<90&&ok(b)){a=b*Math.tan(A*R);c=b/Math.cos(A*R);}
  else if(ok(A)&&A<90&&ok(c)){a=c*Math.sin(A*R);b=c*Math.cos(A*R);}
  else return null;
  return {a,b,c,A,B:90-A};
}
function segArea(r,h){
  h=Math.max(0,Math.min(2*r,h)); if(h<=0)return 0; if(h>=2*r)return Math.PI*r*r;
  return r*r*Math.acos((r-h)/r)-(r-h)*Math.sqrt(2*r*h-h*h);
}
function tank(type,p){
  let total,fill;
  if(type==='v'){const A=Math.PI*p.d*p.d/4;total=A*p.h;fill=A*Math.min(p.level,p.h);}
  else if(type==='h'){const r=p.d/2;total=Math.PI*r*r*p.h;fill=segArea(r,p.level)*p.h;}
  else{const A=p.w*p.l;total=A*p.h;fill=A*Math.min(p.level,p.h);}
  return {total:total/1e6,fill:fill/1e6};
}
function packCuts(stock,kerf,pieces){
  const sorted=pieces.slice().sort((a,b)=>b-a), bars=[];
  for(const p of sorted){
    let placed=false;
    for(const b of bars){
      const need=b.used+kerf+p;
      if(need<=stock+1e-9){b.items.push(p);b.used=need;placed=true;break;}
    }
    if(!placed)bars.push({items:[p],used:p});
  }
  return bars;
}
const UNITS={
  'Longitud':{base:'m',u:{mm:.001,cm:.01,m:1,km:1000,'pulg (in)':.0254,'pie (ft)':.3048,'yarda (yd)':.9144}},
  'Masa':{u:{g:.001,kg:1,'t (métrica)':1000,'libra (lb)':.45359237,'onza (oz)':.028349523125}},
  'Presión / tensión':{u:{Pa:1,kPa:1e3,MPa:1e6,bar:1e5,psi:6894.757293,ksi:6894757.293,'kgf/cm²':98066.5}},
  'Fuerza':{u:{N:1,kN:1000,kgf:9.80665,'lbf':4.4482216,'tonf (métrica)':9806.65}},
  'Par (torque)':{u:{'N·m':1,'kgf·m':9.80665,'lbf·ft':1.3558179,'lbf·in':.1129848}},
  'Área':{u:{'mm²':1e-6,'cm²':1e-4,'m²':1,'in²':6.4516e-4,'ft²':.09290304}},
  'Volumen':{u:{mL:.001,L:1,'m³':1000,'gal EE.UU.':3.785411784,'gal imp.':4.54609}}
};

function stair(H,riserTarget,Lav){

  const h=H/n, treads=n-1;

  const run=treads*pp;
  return {n,h,treads,p:pp,run,ang:Math.atan2(h,pp)*180/Math.PI,zanca:n*Math.hypot(h,pp),paso:2*h+pp};
}

function areaCalc(t,a,b,c){
  const P=Math.PI;

    case 'rect':return {A:a*b,per:2*(a+b),perLab:'Perímetro'};
    case 'tri':return {A:a*b/2};
    case 'circ':return {A:P*a*a/4,per:P*a,perLab:'Circunferencia'};
    case 'trap':return {A:(a+b)/2*c};
    case 'ring':return {A:P/4*(a*a-b*b)};
    case 'sector':return {A:P*a*a*b/360,per:a*b*P/180,perLab:'Largo del arco'};
    case 'ell':{const x=a/2,y=b/2;return {A:P*x*y,per:P*(3*(x+y)-Math.sqrt((3*x+y)*(x+3*y))),perLab:'Perímetro (aproximado)'};}
  }
}

    case 'cyl':{const r=a/2;return {V:P*r*r*b,S:2*P*r*(r+b)};}
    case 'cone':{const r=a/2,sl=Math.hypot(r,b);return {V:P*r*r*b/3,S:P*r*(r+sl)};}
    case 'sph':{const r=a/2;return {V:4/3*P*r*r*r,S:4*P*r*r};}

}

function parseSurf(txt){
  let add=0,sub=0,n=0;const bad=[],items=[];
  String(txt).split('\n').forEach(l=>{
    l=l.trim(); if(!l)return;
    const neg=/^[-−–]/.test(l); const t=l.replace(/^[-−–+]\s*/,'').replace(/,/g,'.');
    let m=t.match(/^([\d.]+)\s*[x×*]\s*([\d.]+)(?:\s*[x×*]\s*(\d+))?$/i), a, it;
    if(m){a=parseFloat(m[1])*parseFloat(m[2])*(m[3]?+m[3]:1);it={L:parseFloat(m[1]),H:parseFloat(m[2]),q:m[3]?+m[3]:1,a};}

/* Perfiles por unidad: cada montante se corta a la altura del muro y el recorte sobrante de un montante no se reutiliza.
   items: [{L,H,q}] muros con medidas. Las soleras (piso y techo) sí se empalman: se reparten en barras completas. */
function perfilesPared(items,sep,bar){
  let mont=0,sol=0,solPieces=[],montPieces=[],long=false;
  items.forEach(w=>{
    const nm=(Math.ceil(w.L/sep-1e-9)+1)*w.q;
    if(w.H>bar){mont+=nm*Math.ceil(w.H/bar-1e-9);long=true;}
    else for(let i=0;i<nm;i++)montPieces.push(w.H);
    const full=Math.floor(w.L/bar+1e-9), rest=w.L-full*bar;
    for(let i=0;i<2*w.q;i++){sol+=full;if(rest>1e-6)solPieces.push(rest);}
  });
  if(montPieces.length)mont+=packCuts(bar,0,montPieces).length;
  if(solPieces.length)sol+=packCuts(bar,0,solPieces).length;
  return {mont,sol,long};
}

let cDeg=true,cAns=0,cFresh=false;const cHistory=[];
function cEl(){return document.getElementById('cx');}
function cFire(){cEl().dispatchEvent(new Event('input',{bubbles:true}));}
function cKey(tok){
  const el=cEl();
  const OPS=['+','−','×','÷','^','%','!','^2','^(-1)'];
  let st=el.selectionStart,en=el.selectionEnd;
  if(cFresh){if(!OPS.includes(tok))el.value='';cFresh=false;st=en=el.value.length;}
  if(st==null){st=en=el.value.length;}
  el.value=el.value.slice(0,st)+tok+el.value.slice(en);
  try{el.setSelectionRange(st+tok.length,st+tok.length);}catch(e){}
  cFire();
}
function cDel(){
  const el=cEl();cFresh=false;
  let st=el.selectionStart,en=el.selectionEnd;
  if(st==null){st=en=el.value.length;}
  if(st===en&&st>0)st-=1;
  el.value=el.value.slice(0,st)+el.value.slice(en);
  try{el.setSelectionRange(st,st);}catch(e){}
  cFire();
}
function cClr(){const el=cEl();cFresh=false;el.value='';cFire();}
function cNeg(){const el=cEl();cFresh=false;el.value=el.value.trim()?'−('+el.value+')':'−';cFire();}
function cMode(){cDeg=!cDeg;const b=document.getElementById('cmode');if(b)b.textContent=cDeg?'DEG':'RAD';cFire();}
function cHistRender(){
  const ul=document.getElementById('ch');if(!ul)return;
  ul.innerHTML=cHistory.slice(-6).reverse().map((h,i)=>`<li onclick="cUse(${cHistory.length-1-i})"><span>${h.e.replace(/</g,'&lt;')}</span><b>${h.r}</b></li>`).join('');
}
function cUse(i){const h=cHistory[i];if(!h)return;cFresh=false;cEl().value=h.e;cFire();}
function cEq(){
  const el=cEl(),cr=document.getElementById('cr'),txt=el.value;
  if(!txt.trim())return;
  try{
    const v=sciEval(txt,cDeg,cAns);
    if(!isFinite(v))throw new Error('x');
    cHistory.push({e:txt,r:fmtSci(v)});cAns=v;
    el.value=String(Number(v.toPrecision(12)));cFresh=true;cFire();cHistRender();
  }catch(e){cr.textContent='Error';cr.className='cres bad';}
}

function plDim(ctx,A,B,offPx,text,k,C,ext,tag){

}

const TVN=6,tvi=(b,k)=>b+(k>1?k:'');
function tvRows(){
  let o='';
  for(let k=1;k<=TVN;k++){
    const g='tvg'+k;
    o+=sel(tvi('tv',k),'Vano '+k,[['0','Sin vano'],['1','Puerta'],['2','Ventana'],['3','Abertura sin puerta (paso libre)']],'0','tvs'+k)
      +fld(tvi('tvx',k),'Vano '+k+': distancia desde la izquierda',String(1000+(k-1)*1500),'mm',g)+fld(tvi('tvw',k),'Vano '+k+': ancho',k%2?'900':'1200','mm',g)
      +fld(tvi('tvh',k),'Vano '+k+': altura libre',k%2?'2050':'1200','mm',g)+fld(tvi('tvs',k),'Vano '+k+': alféizar (altura desde el piso)',k%2?'0':'900','mm',g);
  }
  return o;
}
function tabSvg(r,L,H,vs){
  const W=300,sc=Math.min(W/L,130/H),w=L*sc,h=H*sc,x0=10,y0=12,th=5;
  let o=`<rect x="${x0}" y="${y0}" width="${w}" height="${th}" class="sh"/><rect x="${x0}" y="${y0+h-th}" width="${w}" height="${th}" class="sh"/>`;
  r.regular.forEach(p=>{o+=`<rect x="${x0+p*sc-2}" y="${y0+th}" width="4" height="${h-2*th}" class="sh"/>`;});
  (vs||[]).forEach(v=>{
    const a=x0+v.x0*sc,b=x0+v.x1*sc,top=y0+h-v.h*sc,bot=y0+h-v.sill*sc;
    o+=`<rect x="${a-6}" y="${y0+th}" width="4" height="${h-2*th}" class="fl"/><rect x="${b+2}" y="${y0+th}" width="4" height="${h-2*th}" class="fl"/>`;
    o+=`<rect x="${a}" y="${top}" width="${b-a}" height="${th}" class="fl"/>`;
    if(v.sill>0)o+=`<rect x="${a}" y="${bot-th}" width="${b-a}" height="${th}" class="fl"/>`;
    o+=`<rect x="${a}" y="${top+th}" width="${b-a}" height="${Math.max(1,bot-top-th*(v.sill>0?2:1))}" style="fill:none;stroke:var(--muted);stroke-dasharray:3 3"/>`;
    r.pos.filter(p=>p>v.x0+1&&p<v.x1-1).forEach(p=>{const x=x0+p*sc-2;if(H-v.h>1)o+=`<rect x="${x}" y="${y0+th}" width="4" height="${Math.max(2,top-y0-th)}" class="sh"/>`;if(v.sill>0)o+=`<rect x="${x}" y="${bot}" width="4" height="${Math.max(2,y0+h-th-bot)}" class="sh"/>`;});
  });
  o+=`<text x="${x0}" y="${y0+h+14}" style="font:600 11px var(--font-body);fill:var(--muted)">${fmt(L,0)} × ${fmt(H,0)} mm</text>`;
  return `<figure class="fig" style="margin-top:12px"><svg viewBox="0 0 ${W+20} ${h+30}" role="img" aria-label="Esquema del tabique">${o}</svg><figcaption>Azul: montantes del tramo. Amarillo: montantes dobles de jamba y piezas de cada vano.</figcaption></figure>`;
}
function tabiqueTool(){
  const DEF={1:[900,2050,0],2:[1200,1200,900],3:[1000,2100,0]};
  const vanos=[];let open=true;
  for(let k=1;k<=TVN;k++){
    const el=document.getElementById(tvi('tv',k));
    const lab=el.closest('.f');lab.hidden=!open;
    if(!el.dataset.s){el.dataset.s=el.value;}
    else if(el.dataset.s!==el.value){el.dataset.s=el.value;const d=DEF[el.value];if(d){document.getElementById(tvi('tvw',k)).value=d[0];document.getElementById(tvi('tvh',k)).value=d[1];document.getElementById(tvi('tvs',k)).value=d[2];}}
    const tv=open?el.value:'0';
    $$('[data-g=tvg'+k+']').forEach(e=>e.hidden=tv==='0');
    if(tv!=='0'){document.getElementById(tvi('tvs',k)).closest('.f').hidden=tv!=='2';
      vanos.push({k,tipo:tv,x:N(tvi('tvx',k))||0,w:N(tvi('tvw',k)),h:N(tvi('tvh',k)),sill:tv==='2'?N(tvi('tvs',k))||0:0});}
    open=open&&tv!=='0';
  }
  const L=N('tl'),H=N('th'),sep=N('tso')>0?N('tso'):+V('ts'),bar=N('tb');
  if(!pos(L,H,sep,bar)||vanos.some(v=>!pos(v.w,v.h))) return $('#out').innerHTML=need;
  if(sep>L) return $('#out').innerHTML='<p class="msg">La separación es mayor que el largo del tabique.</p>';
  const r=tabiqueCalc({L,H,sep,bar,reparto:V('tr'),vanos});
  const gs={};r.gaps.forEach(g=>{const k=Math.round(g*10)/10;gs[k]=(gs[k]||0)+1;});
  const summ=Object.keys(gs).sort((a,b)=>gs[b]-gs[a]).map(k=>gs[k]+' de '+fmt(+k,1)+' mm').join(' + ');
  const lista=r.regular.map(p=>fmt(p,0)+(r.vanos.some(v=>Math.abs(p-v.x0)<1.5||Math.abs(p-v.x1)<1.5)?' (doble)':'')).join(' · ');
  const vlist=r.vanos.map((v,i)=>'Vano '+(i+1)+': '+(v.sill>0?'ventana':'puerta')+' de '+fmt(v.x1-v.x0,0)+' × '+fmt(v.h-v.sill,0)+(v.sill>0?' (alféizar '+fmt(v.sill,0)+')':'')+' desde '+fmt(v.x0,0)+' mm').join('<br>');
  $('#out').innerHTML=res(
    row('Montantes (barras de '+fmt(bar/1000,2)+' m)',r.mont,'u.','key')+
    row('Soleras (barras de '+fmt(bar/1000,2)+' m)',r.sol,'u.','key')+
    row('Montantes colocados en total',r.total,'u.')+
    row('Espacios entre montantes',summ,'')+
    (V('tr')==='fijo'&&r.gaps.length>1&&r.gaps[r.gaps.length-1]<sep-1?row('Último espacio',fmt(r.gaps[r.gaps.length-1],1),'mm','warn'):'')+
    (r.jamb?row('Montantes extra de jamba',r.jamb,'u.'):'')+
    ((r.cripAbove+r.cripBelow)?row('Montantes cortos en los vanos',r.cripAbove+r.cripBelow,'u.'):'')+
    row('Perfil total comprado',fmt(r.perfilM,1),'m')
  )+tabSvg(r,L,H,r.vanos)+
  `<details class="gloss" open><summary>Posición de cada montante</summary><p class="note" style="margin:10px 0 0">Distancia al borde izquierdo, en mm, medida al eje de cada montante de altura completa${r.vanos.length?' (los de jamba van dobles)':''}:<br><b>${lista}</b></p>${vlist?'<p class="note">'+vlist+'</p>':''}</details>`+
  (r.long?'<p class="note">El alto supera el largo de la barra: cada montante necesita empalme o una barra más larga.</p>':'')+r.notes.map(n=>'<p class="note">'+n+'</p>').join('')+
  '<p class="note">Cuenta de perfiles para el pedido. Las placas, tornillos y masilla de este mismo tabique los calculás en Cantidades de obra. Verificá largos de barra y separaciones con el sistema que uses.</p>';
}

 calc(){

  if(!isFinite(tot)) return $('#out').innerHTML='<p class="msg">El espesor de pared es demasiado grande para esa medida.</p>';

  )+'<p class="note">La separación libre máxima que se exige en rejas y barandas depende del reglamento de tu zona. Un valor habitual para que no pase un niño es 100 mm. Verificá antes de fabricar.</p>';

{id:'viga',name:'Viga apoyada',desc:'Flexión, corte y flecha',

 html:()=>`<div class="form">

  ${fld('sD','Diámetro exterior','88.9','mm','tubeR')}${fld('st','Espesor de pared','4','mm','tubeR')}
  ${fld('cI','Inercia Ix','1943','cm⁴','custom')}${fld('cW','Módulo resistente Wx','194','cm³','custom')}${fld('cm','Masa','22.4','kg/m','custom')}${fld('cAv','Área de corte (opcional)','','cm²','custom')}

  ${sel('lim','Flecha admisible',[[250,'L/250'],[300,'L/300'],[360,'L/360'],[400,'L/400'],[500,'L/500']],300)}${sel('sw','Peso propio',[[1,'Sumarlo'],[0,'Ya incluido']],1)}

    row('Relación luz / flecha','L/'+fmt(c.d>0?L*1000/c.d:Infinity,0))+
    (best?row('IPE más liviano que cumple',best,''):'')
  );
 }},

{id:'escalera',name:'Escaleras',desc:'Recta, descanso, caracol, marinera, gato',
 fig:()=>FIG.escalera(V('et')),
 html:()=>`<div class="form">
  ${sel('et','Tipo de escalera',[['r','Recta'],['l','Con descanso en L (90°)'],['u','Con descanso en U (180°)'],['c','Caracol (helicoidal)'],['m','Marinera (muy inclinada)'],['g','De gato (vertical)']],'r','','full')}
  ${fld('eh','Altura total a salvar (piso a piso)','2800','mm')}
  ${fld('er','Contrahuella deseada','175','mm','r l u c m')}
  ${fld('es','Separación deseada entre peldaños','300','mm','g')}
  ${fld('el','Espacio horizontal disponible (opcional)','','mm','r')}
  ${fld('ea','Ancho de la escalera','900','mm','r l u')}
  ${fld('en1','Escalones hasta el descanso (opcional)','','u.','l u')}
  ${fld('eq','Hueco entre tramos','100','mm','u')}
  ${fld('ed','Diámetro exterior','1600','mm','c')}
  ${fld('ec','Diámetro de la columna central','100','mm','c')}
  ${fld('eang','Ángulo de cada escalón','22.5','°','c')}
  ${fld('em','Ángulo de inclinación','60','°','m')}
  ${fld('ew','Ancho entre laterales','450','mm','g')}
  ${fld('ex','Prolongación sobre el nivel superior','1000','mm','g')}
  <p class="hint" id="ehint"></p></div><div id="out"></div><details class="gloss" id="egloss"></details>`,
 calc(){
  const t=V('et'); $$('[data-g]').forEach(e=>e.hidden=!e.dataset.g.split(' ').includes(t));
  const HINT={
   r:'Si no cargás el espacio horizontal, la huella se calcula con la regla del paso: 2 × contrahuella + huella = 630 mm.',
   l:'El descanso cuenta como un peldaño más. La huella sale de la regla del paso (2 × contrahuella + huella = 630 mm). Si no indicás los escalones hasta el descanso, se reparten por la mitad.',
   u:'El descanso cuenta como un peldaño más. La huella sale de la regla del paso (2 × contrahuella + huella = 630 mm). Si no indicás los escalones hasta el descanso, se reparten por la mitad.',
   c:'La huella se mide sobre la línea de paso, a mitad del ancho útil entre la columna y el borde exterior. Un ángulo habitual por escalón va de 20° a 30°.',
   m:'Pendiente alta, usual para accesos a entrepisos técnicos o salas de máquinas. Se sube de frente y con pasamanos.',
   g:'El último peldaño queda a una separación del nivel superior y los laterales siguen hacia arriba para agarrarse. A cierta altura suele exigirse aro de protección: verificá el reglamento.'};
  $('#ehint').textContent=HINT[t];
  const GD={
   contra:['Contrahuella','Altura vertical de cada escalón: la parte de adelante que sube de un peldaño al siguiente.'],
   huella:['Huella','Profundidad del escalón: la parte horizontal donde se apoya el pie.'],
   peldano:['Peldaño','La pieza horizontal sobre la que se pisa. En la escalera de gato es el travesaño.'],
   zanca:['Zanca','Viga inclinada que sostiene los peldaños. Se usa una a cada lado o una central. Su largo va de un piso al otro.'],
   altura:['Altura total','Desnivel entre el piso de salida y el piso de llegada.'],
   recorrido:['Recorrido horizontal','Distancia horizontal que ocupa la escalera, entre el primer y el último escalón.'],
   incl:['Inclinación','Ángulo de la escalera respecto de la horizontal.'],
   paso:['Regla del paso','Suma de dos contrahuellas más una huella. Entre 600 y 640 mm da un paso cómodo.'],
   desc:['Descanso','Plataforma plana intermedia donde la escalera cambia de dirección. Cuenta como un peldaño.'],
   hueco:['Hueco entre tramos','Espacio libre entre los dos tramos de una escalera en U.'],
   col:['Columna central','Tubo vertical donde se fijan los escalones de un caracol.'],
   lp:['Línea de paso','Recorrido imaginario de quien sube, a mitad del ancho útil. Sobre esa línea se mide la huella.'],
   util:['Ancho útil','Espacio entre la columna y el borde exterior donde se pisa.'],
   ang:['Ángulo por escalón','Cuánto gira cada escalón alrededor de la columna. 360° dividido ese ángulo da los escalones por vuelta.'],
   libre:['Altura libre','Distancia vertical entre un escalón y el que queda justo encima, una vuelta después. Evita golpes en la cabeza.'],
   lat:['Lateral','Cada uno de los dos perfiles verticales de una escalera de gato, donde se sueldan los peldaños.'],
   prol:['Prolongación','Parte de los laterales que sobresale del nivel superior para agarrarse al subir y bajar.'],
   sep:['Separación','Distancia de centro a centro entre dos peldaños de una escalera de gato.']};
  const GL={r:['contra','huella','peldano','zanca','altura','recorrido','incl','paso'],
   l:['contra','huella','zanca','desc','altura','paso'],u:['contra','huella','zanca','desc','hueco','altura','paso'],
   c:['contra','huella','col','lp','util','ang','libre','altura'],m:['contra','huella','zanca','altura','incl'],g:['peldano','sep','lat','prol','altura']};
  const gd=document.getElementById('egloss');
  if(gd.dataset.t!==t){gd.dataset.t=t;gd.innerHTML='<summary>Qué significa cada término</summary><dl>'+GL[t].map(k=>`<div><dt>${GD[k][0]}</dt><dd>${GD[k][1]}</dd></div>`).join('')+'</dl>';}
  const H=N('eh'), R=N('er');
  const REF='<p class="note">Referencias habituales: contrahuella de 150 a 190 mm, huella de 250 a 320 mm y paso de 600 a 640 mm. Los valores en naranja quedan fuera de ese rango. Verificá con el reglamento de tu zona. Las medidas son a eje del escalón, sin espesor de peldaño.</p>';
  const out=h=>$('#out').innerHTML=h;
  if(t==='g'){
    const S=N('es'),W=N('ew'),X=N('ex')||0;
    if(!pos(H,S,W)) return out(need);
    const r=ladderV(H,S,X);
    return out(res(
      row('Cantidad de peldaños',r.rungs,'u.','key')+
      row('Separación real entre peldaños',fmt(r.sp,1),'mm',r.sp<250||r.sp>300?'warn':'')+
      row('Largo de cada lateral',fmt(r.rail,0),'mm')+
      row('Largo de cada peldaño',fmt(W,0),'mm')+
      row('Altura hasta el nivel superior',fmt(H,0),'mm')
    )+'<p class="note">El primer peldaño queda a una separación del piso y el último a una separación del nivel superior. Referencia habitual de separación: 250 a 300 mm. Verificá con el reglamento si hace falta protección (aro) y a qué altura.</p>');
  }
  if(t==='c'){
    const D=N('ed'),dc=N('ec'),ang=N('eang');
    if(!pos(H,R,D,dc,ang)||dc>=D||ang>90) return out(need);
    const r=stairSpiral(H,R,D,dc,ang);
    return out(res(
      row('Escalones (contrahuellas)',r.n,'u.','key')+
      row('Altura de cada contrahuella',fmt(r.h,1),'mm',r.h<150||r.h>220?'warn':'')+
      row('Escalones por vuelta',fmt(r.perTurn,1),'u.')+
      row('Vueltas totales',fmt(r.turns,2))+
      row('Huella en la línea de paso',fmt(r.pw,0),'mm')+
      row('Ancho útil (columna a borde)',fmt(r.width,0),'mm')+
      row('Ancho del escalón en el borde exterior',fmt(r.arcOut,0),'mm')+
      row('Ancho del escalón en el borde interior',fmt(r.arcIn,0),'mm')+
      row('Altura libre entre vueltas',fmt(r.head,0),'mm',r.head<2000?'bad':'good')+
      row('Largo de la línea de paso',fmt(r.walk,0),'mm')+
      row('Largo del barandal exterior',fmt(r.rail,0),'mm')
    )+'<p class="note">En el caracol la regla del paso no se aplica igual que en una escalera recta. La altura libre entre vueltas debería ser de al menos 2000 mm para no golpearse la cabeza; descontá el espesor del peldaño. Verificá con el reglamento de tu zona.</p>');
  }
  if(t==='m'){
    const ang=N('em');
    if(!pos(H,R,ang)||ang>=90) return out(need);

    return out(res(
      row('Escalones (contrahuellas)',r.n,'u.','key')+
      row('Altura de cada contrahuella',fmt(r.h,1),'mm',r.h>250?'warn':'')+
      row('Huella (profundidad del escalón)',fmt(r.p,1),'mm')+
      row('Cantidad de huellas o peldaños',r.tr,'u.')+
      row('Inclinación',fmt(ang,1),'°',ang<50||ang>75?'warn':'')+
      row('Recorrido horizontal total',fmt(r.run,0),'mm')+
      row('Longitud de la zanca',fmt(r.zanca,0),'mm')
    )+'<p class="note">Una inclinación de 50° a 75° es lo habitual en escaleras marineras. Fuera de ese rango conviene usar una escalera recta o una de gato. Verificá con el reglamento de tu zona.</p>');
  }
  if(t==='l'||t==='u'){
    const A=N('ea'),gap=N('eq')||0,n1=N('en1');
    if(!pos(H,R,A)) return out(need);
    const r=stairLanding(H,R,n1,A,gap,t), okPaso=r.paso>=600&&r.paso<=640;
    return out(res(
      row('Escalones totales',r.n,'u.','key')+

      row('Huella (profundidad del escalón)',fmt(r.p,1),'mm',r.p<250||r.p>320?'warn':'')+

 calc(){

  {const cp=document.getElementById('cp');if(cp&&!cp.dataset.syn){cp.dataset.syn='1';const v=V('cly');if(v){const sh=linkShapes(v);if(sh){const r=cutsRefresh(cp.value,sh);if(r.n){cp.value=r.text;linkMsg('Se actualizaron '+r.n+' medida(s) con lo que cambió en el plano.');}}}}

  const S=N('cs'),k=N('ck')||0, pieces=[], bad=[];
  V('cp').split('\n').forEach(line=>{
    if(!line.trim())return;
    const m=line.trim().match(/^([\d.,]+)\s*(?:[x×*]\s*(\d+))?\s*(?:#.*)?$/i);
    if(!m){bad.push(line.trim());return;}
    const len=parseFloat(m[1].replace(',','.')), q=Math.min(500,m[2]?+m[2]:1);
    if(!(len>0)){bad.push(line.trim());return;}
    for(let i=0;i<q;i++)pieces.push(len);
  });
  if(!pos(S)||!pieces.length) return $('#out').innerHTML=need;
  const big=pieces.filter(p=>p>S);
  if(big.length) return $('#out').innerHTML=`<p class="msg">Hay piezas más largas que la barra (${fmt(Math.max(...big),0)} mm).</p>`;
  const bars=packCuts(S,k,pieces), used=pieces.reduce((a,b)=>a+b,0), mat=bars.length*S;
  let extra='';
  if(pick&&pick.kgm)extra=row('Peso de lo que hay que comprar',fmt(bars.length*S/1000*pick.kgm,1),'kg')+row('Peso de las piezas',fmt(used/1000*pick.kgm,1),'kg');
  $('#out').innerHTML=res(
    row('Barras necesarias',bars.length,'u.','key')+
    row('Piezas a cortar',pieces.length,'u.')+
    row('Aprovechamiento',fmt(used/mat*100,1),'%')+
    row('Sobrante total',fmt(mat-used,0),'mm')+extra
  )+`<div class="bars">${bars.map((b,i)=>`<div><div class="barlab"><span>Barra ${i+1}</span><span>sobrante ${fmt(S-b.used,0)} mm</span></div><div class="bar">${b.items.map((x,j)=>`<span class="seg p${j%2}" style="width:${x/S*100}%">${fmt(x,0)}</span>`).join('')}</div></div>`).join('')}</div>`+
  (bad.length?`<p class="note">No se entendió: ${bad.join(' | ')}</p>`:'');
 }},

{id:'gas',name:'Cañería de gas',desc:'Diámetros según NAG-200 (ENARGAS)',
 fig:()=>FIG.gas(),
 html:()=>`<div class="form">
  <label class="f full" for="gm"><span>Material de la cañería</span><div class="in"><select id="gm">${GAS_MAT.map(m=>`<option value="${m.k}">${m.n}${m.ver?'':' *'}</option>`).join('')}</select></div></label>
  <p class="hint" id="gmh"></p>
  ${sel('gu','Unidad de los consumos',[['k','kcal/h'],['w','kW'],['m','m³/h']],'k')}
  ${fld('gl','Caída de presión admisible','1','mbar')}
  ${fld('gx','Aumento por accesorios (longitud equivalente)','20','%')}
  ${sel('gr','Aplicar mínimo de vivienda (18 600 kcal/h) a cada tramo',[['0','No'],['1','Sí']],'0','','full')}
  <label class="f full" for="ga"><span>Artefactos (opcional): nombre y consumo, uno por línea</span><div class="in"><textarea id="ga" spellcheck="false">Cocina 8000
Calefón 18000
Estufa 3000</textarea></div></label>
  <label class="f full" for="gt"><span>Tramos del recorrido más largo, del medidor al artefacto más lejano: nombre ; largo en m ; consumo</span><div class="in"><textarea id="gt" spellcheck="false">Medidor a derivación ; 6 ;
Derivación a calefón ; 4 ; 18000</textarea></div></label>
  <p class="hint">Si en un tramo dejás vacío el consumo, usa el total simultáneo de los artefactos de arriba. Si ese tramo alimenta un solo artefacto, escribí el consumo de ese artefacto.</p>
  <h3 class="sec">Vincular con un plano</h3>
  <label class="f full" for="gly"><span>Plano de un proyecto (agrupados por proyecto)</span><div class="in"><select id="gly">${linkOptions()}</select></div></label>
  <div class="btns full"><button type="button" class="pb on" data-lk="gas-get">Traer tramos de gas del plano</button><button type="button" class="pb" data-lk="gas-send">Enviar diámetros al plano</button></div>
  <p class="hint" id="gMsg">Los tramos de gas se dibujan en Planos con la línea de instalación «Gas». Acá el nombre de cada tramo es su número (G1, G2…), y los diámetros calculados vuelven al plano con ese número.</p></div><div id="out"></div>${glossHtml([['Longitud equivalente','Largo real del tramo más un aumento por codos, tes y llaves. La norma usa un 20 % más.'],['Caída de presión','Presión que se pierde por el roce del gas en el caño. Hasta el artefacto más lejano no puede pasar de 1 mbar (10 mm de columna de agua).'],['Velocidad','Con baja presión no debe pasar de 7 m/s, para que no haya ruido ni problemas.'],['Simultaneidad','Es muy raro que todos los artefactos funcionen a la vez. Se cuentan los dos mayores completos y la mitad del resto.']])}`,
 calc(){
  const M=GAS_MAT.find(m=>m.k===V('gm'))||GAS_MAT[0];
  $('#gmh').textContent=(M.ver?'Medidas interiores de la norma o del fabricante. ':'Medidas habituales: confirmalas con el fabricante (*). ')+'Largo de tubo habitual: '+fmt(M.len/1000,1)+' m.';
  const u=V('gu'),toQ=v=>u==='k'?v/9300:u==='w'?v*860/9300:v;
  const arts=[];V('ga').split('\n').forEach(l=>{const m=l.trim().match(/^(.*?)[\s;:]*([\d.,]+)\s*$/);if(m){const v=parseFloat(m[2].replace(',','.'));if(v>0)arts.push({n:m[1].trim()||'Artefacto',v});}});
  const qsi=arts.length?toQ(gasQsi(arts.map(a=>a.v))):0,minQ=18600/9300;
  const tr=[],bad=[];
  V('gt').split('\n').forEach(l=>{
    if(!l.trim())return;const p=l.split(';').map(x=>x.trim()),L=parseFloat((p[1]||'').replace(',','.')),
      qv=parseFloat((p[2]||'').replace(',','.'));
    if(p.length<2||!(L>0)){bad.push(l.trim());return;}
    let Q=qv>0?toQ(qv):qsi;if(V('gr')==='1')Q=Math.max(Q,minQ);
    tr.push({name:p[0]||('T'+(tr.length+1)),L,Q});
  });
  if(!tr.length)return $('#out').innerHTML=need;
  if(tr.some(t=>!(t.Q>0)))return $('#out').innerHTML='<p class="msg">Falta el consumo: cargá artefactos arriba o poné el consumo en cada tramo.</p>';
  const r=gasSize(tr,M.k,{dp:N('gl')||1,extra:isFinite(N('gx'))?N('gx'):20});
  window.GASLAST={};r.rows.forEach(x=>{GASLAST[x.name.toUpperCase()]=x.lab.replace(/"/g,'”');});
  const g={};r.rows.forEach(x=>{(g[x.lab]=g[x.lab]||{lab:x.lab,di:x.di,len:0,pieces:[]});g[x.lab].len+=x.L;g[x.lab].pieces.push(x.L*1000);});
  const mat=Object.values(g).map(q=>row('Diámetro '+q.lab+(M.k==='ac'?' ('+q.di+' mm interior)':''),fmt(q.len,2)+' m',packCuts(M.len,3,q.pieces).length+' tubo(s) de '+fmt(M.len/1000,1)+' m')).join('');
  $('#out').innerHTML=res(
    row('Caída total en el recorrido',fmt(r.dpT,2),'mbar de '+fmt(r.dpMax,1)+' permitidos',r.ok?'key good':'key bad')+
    (arts.length?row('Consumo simultáneo de la vivienda',fmt(qsi*9300,0),'kcal/h ('+fmt(qsi,2)+' m³/h)'):'')+
    r.rows.map(x=>row(x.name+' → '+x.lab,fmt(x.Q,2)+' m³/h',x.ok?'':'no alcanza')).join(''))+
   `<div class="tblw"><table><thead><tr><th>Tramo</th><th>Largo m</th><th>Le m</th><th>Caudal m³/h</th><th>Caída permitida</th><th>Diámetro</th><th>Caída real</th><th>Velocidad m/s</th></tr></thead><tbody>${r.rows.map(x=>`<tr><td>${x.name}</td><td>${fmt(x.L,2)}</td><td>${fmt(x.Le,2)}</td><td>${fmt(x.Q,2)}</td><td>${fmt(x.lim,3)}</td><td>${x.lab}${x.ok?'':' ⚠'}</td><td>${fmt(x.dp,3)}</td><td>${fmt(x.v,2)}</td></tr>`).join('')}</tbody></table></div>`+
   '<h3 class="sec" style="margin-top:14px">Material</h3>'+res(mat)+
   (r.ok?'':'<p class="note">Con este material no alcanza: elegí un diámetro mayor, otro material o revisá los caudales.</p>')+
   (bad.length?`<p class="note">No se entendió: ${bad.join(' | ')}</p>`:'')+
   '<p class="note">Método de la NAG-200 (ENARGAS): Renouard lineal con gas natural (densidad relativa 0,65, 9300 kcal/m³), caída máxima de 1 mbar hasta el artefacto más lejano y velocidad máxima de 7 m/s. Es una ayuda de cálculo: el proyecto definitivo lo firma un gasista matriculado y lo aprueba la prestadora (Camuzzi), que puede pedir otros datos.</p>';
 }},

 calc(){
  const t=V('ot'), isDl=!!DL[t];
  const W={simple:5,doble:5,cielo:5,superboard:5,desplegado:10,chapa:10,malla:10,ladrillo:5,pintura:5,revest:10};
  const el=document.getElementById('ot');
  if(!el.dataset.s)el.dataset.s=t;
  else if(el.dataset.s!==t){el.dataset.s=t;document.getElementById('ow').value=W[t];}
  const GR={dl:isDl,dlw:t==='simple'||t==='doble',sb:t==='superboard',md:t==='desplegado',ch:t==='chapa',ml:t==='malla',lad:t==='ladrillo',pin:t==='pintura',rev:t==='revest'};
  $$('[data-g]').forEach(e=>e.hidden=!GR[e.dataset.g]);
  document.getElementById('om').closest('.f').hidden=t==='cielo'||!isDl;
  const sk=t==='desplegado'?V('osd'):t==='chapa'?V('osc'):t==='malla'?V('osm'):'';
  $$('[data-g=cu]').forEach(e=>e.hidden=sk!=='custom');
  const hints={simple:'Pared con placa en ambas caras (por eso se usan unas 2 placas por m² de pared). Montantes y soleras se cuentan por pieza de 2,60 m: cada montante se corta a la altura del muro y el sobrante no se reutiliza.',doble:'Dos capas de placa de cada lado. Perfiles contados por pieza como en pared simple.',cielo:'Cielorraso con junta tomada. Coeficientes por m² del fabricante; perfiles por barra de 2,60 m.',superboard:'Placas de 1,20 × 2,40 m. Los pesos son de ficha técnica. No incluye perfilería ni tornillos.',desplegado:'Medidas de hoja habituales. El espesor y la serie del rombo (por ejemplo 270-16-20) se piden al comprar. Subí el desperdicio si hay muchos recortes.',chapa:'Medidas de hoja habituales, confirmalas con tu proveedor. Peso = espesor × densidad del material.',malla:'Panel de 2,15 × 6,00 m habitual. Si tu proveedor tiene otro, elegí Otra medida.',ladrillo:'Estimación geométrica con junta de 1,5 cm. Dejá margen para roturas.',pintura:'El rendimiento depende de la pintura y la pared: mirá la lata (suele ser 10 a 14 m²/L por mano).',revest:'Estimación geométrica. Agregá 10 % o más si va en diagonal.'};
  $('#ohint').textContent=hints[t];
  obraPiezas();
  const sf=parseSurf(V('os')), A=sf.net;
  let sheet=0;
  if(sk){if(sk==='custom')sheet=N('osl')*N('osw');else{const x=SHEETS[t].find(y=>y[0]===sk);sheet=x?x[2]*x[3]:0;}}
  const o={A,w:N('ow')||0,mod:+V('om'),plate:+V('op'),lana:V('olana')==='1',esp:+V('oe'),sheet,e:N('ose'),rho:RHO[V('osr')],faces:+V('ocr'),items:sf.items,brick:V('obk'),manos:N('omn'),rend:N('ore'),pa:N('opa'),pb:N('opb'),junta:N('oj')||0};
  if(!(A>0)||(sk&&!(sheet>0))||(t==='pintura'&&!pos(o.manos,o.rend))||(t==='revest'&&!pos(o.pa,o.pb))) return $('#out').innerHTML=need;
  const r=obraCalc(t,o);
  $('#out').innerHTML=res((sf.sub>0?row('Superficies cargadas',fmt(sf.add,2),'m²')+row('Aberturas restadas',fmt(sf.sub,2),'m²'):'')+row('Superficie neta',fmt(A,2),'m²')+r.map(x=>row(x.label,fmt(x.q,x.u==='m³'?3:(x.u==='u.'?0:2)),x.u,x.key?'key':'')).join(''))+(sf.bad.length?`<p class="note">No se entendió: ${sf.bad.join(' | ')}</p>`:'');
 }},

const MEM={};
function store(id){if(MEM[id])return MEM[id];try{return JSON.parse(localStorage.getItem('ta:'+id)||'{}');}catch(e){return {};}}
function save(id){const o=Object.assign({},store(id));$$('#main input,#main select,#main textarea').forEach(e=>{if(e.id)o[e.id]=e.value;});persist(id,o);}

/* ---- Vínculo entre herramientas y planos, agrupado por proyecto ---- */
function obraPiezas(){
  const e=document.getElementById('opz');if(!e)return;
  const d=store('plano-d'),pr=d&&d.proj&&plProjs().find(x=>x.id===d.proj.id);let sh=[];
  if(pr){sh=sh.concat(pr.plans.filter(l=>!(d.proj.lid===l.id)).flatMap(l=>l.shapes));if(Array.isArray(d.shapes))sh=sh.concat(d.shapes.filter(x=>!x.lk));}
  else if(d&&Array.isArray(d.shapes))sh=d.shapes;
  const fl=fitList(sh),tl=planilla(sh);
  e.innerHTML=(fl.length||tl.length)?'<h3 class="sec">Instalaciones del plano abierto'+(pr?' ('+plEsc(pr.name)+', todas las capas)':'')+'</h3>'+res(tl.map((g,i)=>row(g.name+(g.dia?' Ø'+g.dia:'')+(g.mat?' · '+g.mat:''),fmt(g.len/1000,2),'m',i?'':'key')).join('')+fl.map(f=>row(instOf(f.ins)[1]+' · '+f.name+(f.dia?' Ø'+f.dia:''),f.n,'u.')).join('')):'';
}
function linkOptions(){
  let o='<option value="">— elegir plano —</option><option value="cur">Plano abierto ahora (sin proyecto)</option>';
  plProjs().forEach(p=>{o+='<optgroup label="'+plEsc(p.name)+'"><option value="'+p.id+':base">Planta base</option>'+p.plans.map(x=>'<option value="'+p.id+':'+x.id+'">'+plEsc(x.name)+'</option>').join('')+'</optgroup>';});
  return o;
}
function linkShapes(v){
  const d=store('plano-d');
  if(v==='cur')return Array.isArray(d.shapes)?d.shapes:[];
  const [pid,lid]=String(v).split(':');
  if(d&&d.proj&&d.proj.id===pid&&d.proj.lid===lid&&Array.isArray(d.shapes))return d.shapes;
  const p=plProjs().find(x=>x.id===pid);if(!p)return null;
  if(lid==='base')return p.base;const l=p.plans.find(x=>x.id===lid);return l?l.shapes:null;
}
function linkWrite(v,text){
  const d=store('plano-d');let changed=[];
  const live=v==='cur'||(d.proj&&v===d.proj.id+':'+d.proj.lid);
  if(live&&Array.isArray(d.shapes)){const r=cutsToShapes(text,d.shapes);if(r.changed.length){changed=r.changed;persist('plano-d',Object.assign({},d,{shapes:r.shapes}));}}
  if(v!=='cur'){const [pid,lid]=v.split(':'),all=plProjs().slice(),p=all.find(x=>x.id===pid),l=p&&p.plans.find(x=>x.id===lid);
    if(l){const r=cutsToShapes(text,l.shapes);if(r.changed.length){l.shapes=r.shapes;plProjSave(all);changed=r.changed;}}}
  return changed;
}
function linkSetDia(v,map){
  const d=store('plano-d');let changed=[];
  const live=v==='cur'||(d.proj&&v===d.proj.id+':'+d.proj.lid);
  if(live&&Array.isArray(d.shapes)){const r=diaApply(d.shapes,map);if(r.changed.length){changed=r.changed;persist('plano-d',Object.assign({},d,{shapes:r.shapes}));}}
  if(v!=='cur'){const [pid,lid]=v.split(':'),all=plProjs().slice(),p=all.find(x=>x.id===pid),l=p&&p.plans.find(x=>x.id===lid);
    if(l){const r=diaApply(l.shapes,map);if(r.changed.length){l.shapes=r.shapes;plProjSave(all);changed=r.changed;}}}
  return changed;
}
function linkMsg(t,id){const e=document.getElementById(id||'cpMsg');if(e)e.textContent=t;}
function linkAct(k,quiet){
  const g=id=>document.getElementById(id);
  if(k.startsWith('cut')){
    const v=V('cly'),cp=g('cp');if(!v||!cp){if(!quiet)linkMsg('Elegí primero un plano.');return;}
    const sh=linkShapes(v);if(!sh){linkMsg('Ese plano ya no existe.');return;}
    if(k==='cut-get'){
      const t=cutsFromTramos(sh);if(!t){linkMsg('Ese plano no tiene tramos de instalación. En Planos elegí una «Línea de instalación» y dibujá.');return;}
      cp.value=cp.value.split('\n').filter(l=>l.trim()&&!/#\s*[A-Za-z]{1,2}\d+/.test(l)).concat(t.split('\n')).join('\n');
      cp.dispatchEvent(new Event('input',{bubbles:true}));linkMsg('Se trajeron '+t.split('\n').length+' tramos. Si cambiás un largo, se actualiza en el plano.');
    }else if(k==='cut-upd'){const r=cutsRefresh(cp.value,sh);cp.value=r.text;cp.dispatchEvent(new Event('input',{bubbles:true}));linkMsg(r.n?'Se actualizaron '+r.n+' medida(s) desde el plano.':'Ya coincide con el plano.');}
    else{const ch=linkWrite(v,cp.value);if(ch.length)linkMsg('Plano actualizado: '+ch.join(', ')+'. Abrí Planos para verlo.');else if(!quiet)linkMsg('No hay cambios para enviar.');}
  }else if(k==='gas-get'){
    const v=V('gly'),gt=g('gt');if(!v||!gt){linkMsg('Elegí primero un plano.','gMsg');return;}
    const tl=tramoList(linkShapes(v)||[]).filter(t=>t.ins==='gas');
    if(!tl.length){linkMsg('Ese plano no tiene tramos de gas. En Planos elegí la línea de instalación «Gas» y dibujá.','gMsg');return;}
    gt.value=tl.map(t=>t.id+' ; '+String(Math.round(t.len/10)/100).replace('.',',')+' ; ').join('\n');gt.dispatchEvent(new Event('input',{bubbles:true}));
    linkMsg('Se trajeron '+tl.length+' tramos. Poné el consumo de cada uno y ordenalos del medidor al artefacto más lejano.','gMsg');
  }else if(k==='gas-send'){
    const v=V('gly');if(!v||!window.GASLAST){linkMsg('Elegí un plano y calculá primero.','gMsg');return;}
    const ch=linkSetDia(v,window.GASLAST);linkMsg(ch.length?'Diámetros enviados al plano: '+ch.join(', ')+'.':'No hay tramos del plano con esos nombres (G1, G2…).','gMsg');
  }else if(k==='obra-get'){
    const v=V('oly'),os=g('os');if(!v||!os){linkMsg('Elegí primero un plano.','oMsg');return;}
    const sh=linkShapes(v)||[],d=store('plano-d'),t=surfFromShapes(sh,(d.cfg&&d.cfg.mh)||2600);
    if(!t){linkMsg('Ese plano no tiene paredes ni aberturas.','oMsg');return;}
    os.value=t;os.dispatchEvent(new Event('input',{bubbles:true}));linkMsg('Se trajeron '+t.split('\n').length+' líneas del plano.','oMsg');
  }else if(k==='reja-get'){
    const v=V('rly');if(!v){linkMsg('Elegí primero un plano.','rMsg');return;}
    const rj=(linkShapes(v)||[]).find(x=>x.t==='rj');if(!rj){linkMsg('Ese plano no tiene rejas. En Planos usá la herramienta Reja.','rMsg');return;}
    const r=normRect(rj.a,rj.b,0),fw=Math.min(rj.fr||40,r.W/3,r.H/3),L=rejaLayout(rj.a,rj.b,fw,rj.bw||12,rj.sp||110,rj.dir,rj.n||0);
    const set=(id,x)=>{const e=g(id);if(e)e.value=x;};set('jw',Math.round(r.W));set('jh',Math.round(r.H));set('jn',L.n);set('jm','n');
    g('jw').dispatchEvent(new Event('input',{bubbles:true}));linkMsg('Reja traída: '+Math.round(r.W)+' × '+Math.round(r.H)+' mm con '+L.n+' barrotes.','rMsg');
  }
}
function openTool(t){
  document.title=t.name+' · Taller Acero';
  back.hidden=false; brand.hidden=true;
  main.className='view';
  main.innerHTML=`<h1 class="tt">${t.name}</h1><p class="sub">${t.desc}</p>`+(t.fig?'<figure class="fig" id="fig"></figure>':'')+t.html();
  const saved=store(t.id);
  Object.keys(saved).forEach(k=>{const e=document.getElementById(k);if(e&&!(e.tagName==='SELECT'&&!Array.from(e.options).some(o=>o.value===saved[k])&&e.options.length))e.value=saved[k];});
  const run=()=>{if(t.fig){try{$('#fig').innerHTML=t.fig();}catch(e){}}try{t.calc();}catch(e){$('#out').innerHTML='<p class="msg">No se pudo calcular con esos datos.</p>';}};
  main.oninput=main.onchange=()=>{run();save(t.id);};
  run();
  window.scrollTo(0,0);
}
function route(){
  const id=location.hash.replace('#','');
  const t=TOOLS.find(x=>x.id===id);
  t?openTool(t):home();
}
back.addEventListener('click',()=>{location.hash='';});
window.addEventListener('hashchange',route);
route();
</script>
