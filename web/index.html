<style>

}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12161a; --surface:#1b2127; --field:#141a1f; --ink:#e8ecef; --muted:#97a3ad; --line:#2f3942;

.seg.p0{background:var(--accent)} .seg.p1{background:color-mix(in srgb,var(--accent) 72%,var(--ink))}

.fig .o{fill:none;stroke:var(--ink);stroke-width:2}
.fig .sh{fill:var(--field);stroke:var(--ink);stroke-width:2}
.fig .d{stroke:var(--accent);stroke-width:1.5;fill:none}

.fig .wt{fill:var(--accent);fill-opacity:.3}

.fig .fl{fill:var(--accent);fill-opacity:.4;stroke:var(--ink);stroke-width:1.5}
.fig text{font:600 12px var(--font-body);fill:var(--accent)}
.fig text.t2{fill:var(--muted);font-weight:500}
.mrow{grid-column:1/-1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}
.mrow .full{grid-column:1/-1}

.gloss dl{margin:12px 0 0;display:grid;gap:10px}

@media (max-width:380px){.form{grid-template-columns:minmax(0,1fr)}}
@media (prefers-reduced-motion:no-preference){.view{animation:in .18s ease-out}@keyframes in{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}}
</style>

    <button class="back" id="back" hidden aria-label="Volver al inicio"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>Inicio</button>

<script>
/*CALC-START*/
const RHO={acero:7850,inox304:8000,inox316:8000,alu:2700,cobre:8960,laton:8500,bronce:8800,fundicion:7200,titanio:4500,plomo:11340};
function crossArea(shape,p){
  const {w,h,t,d,s}=p;
  switch(shape){
    case 'flat': return w*t;
    case 'round': return Math.PI*d*d/4;
    case 'square': return s*s;
    case 'hex': return Math.sqrt(3)/2*s*s;
    case 'tube': return d>2*t ? Math.PI/4*(d*d-Math.pow(d-2*t,2)) : NaN;
    case 'rect': return (w>2*t && h>2*t) ? w*h-(w-2*t)*(h-2*t) : NaN;
    case 'angle': return t*(w+h-t);
  }
  return NaN;
}
function massPerM(shape,p,rho){return crossArea(shape,p)*1e-6*rho;}

function beamLoads(L,w,P){return {M:w*L*L/8+P*L/4, V:w*L/2+P/2};}
function beamDefl(L,w,P,I,E){E=E||210000;const Lm=L*1000;return 5*w*Math.pow(Lm,4)/(384*E*I)+P*1000*Math.pow(Lm,3)/(48*E*I);}
function beamCheck(sec,L,w,P,fy,limit,selfW){
  const q=w+(selfW?sec.mass*9.80665/1000:0);
  const {M,V}=beamLoads(L,q,P);
  const sigma=M*1e6/sec.W, uM=sigma/fy;
  const tau=sec.Av?V*1000/sec.Av:NaN, uV=tau/(fy/Math.sqrt(3));
  const d=beamDefl(L,q,P,sec.I), dl=L*1000/limit, uD=d/dl;
  return {q,M,V,sigma,uM,tau,uV,d,dl,uD,ok:uM<=1&&(isNaN(uV)||uV<=1)&&uD<=1};
}
const IPE=[ // nombre, h mm, tw mm, A cm2, Ix cm4, Wel,x cm3, masa kg/m
['IPE 80',80,3.8,7.64,80.1,20.0,6.0],['IPE 100',100,4.1,10.3,171,34.2,8.1],['IPE 120',120,4.4,13.2,318,53.0,10.4],
['IPE 140',140,4.7,16.4,541,77.3,12.9],['IPE 160',160,5.0,20.1,869,109,15.8],['IPE 180',180,5.3,23.9,1317,146,18.8],
['IPE 200',200,5.6,28.5,1943,194,22.4],['IPE 220',220,5.9,33.4,2772,252,26.2],['IPE 240',240,6.2,39.1,3892,324,30.7],
['IPE 270',270,6.6,45.9,5790,429,36.1],['IPE 300',300,7.1,53.8,8356,557,42.2],['IPE 330',330,7.5,62.6,11770,713,49.1],
['IPE 360',360,8.0,72.7,16270,904,57.1],['IPE 400',400,8.6,84.5,23130,1156,66.3]];
function ipeSec(r){return {I:r[4]*1e4,W:r[5]*1e3,Av:r[1]*r[2],mass:r[6]};}

const FEXX={E60:414,E70:483,E80:552};
function minLeg(t){return t<=6.35?3:t<=12.7?5:t<=19.05?6:8;}
function weld(leg,len,fexx,eff,load){
  const throat=leg*Math.SQRT1_2, area=leg*leg/2;
  const kgPerM=area*1e-6*7850, kg=kgPerM*len/1000;
  const phi=0.75*0.6*fexx*throat;       // N/mm, LRFD
  const asd=0.6*fexx*throat/2;          // N/mm, ASD
  return {throat,area,kgPerM,kg,consum:kg/eff,phi,asd,phiTot:phi*len/1000,asdTot:asd*len/1000,
    reqLeg:load>0?load*1000/(len*0.75*0.6*fexx*Math.SQRT1_2):NaN};
}

const UTS={acero:400,inox:600,alu5052:230,alu6061:310,cobre:220,laton:340};
function vDie(t){return Math.round(t<=2.5?6*t:t<=8?8*t:t<=10?10*t:12*t);}
function bend(t,uts,ang,len,V,r,K,A,B){
  V=V>0?V:vDie(t); r=r>0?r:0.16*V;
  const th=ang*Math.PI/180;
  const Fm=1.42*uts*t*t/V;               // kN por metro
  const BA=th*(r+K*t), oss=(r+t)*Math.tan(th/2), BD=2*oss-BA;
  return {V,r,Fm,tf_m:Fm/9.80665,tfTot:Fm*len/1000/9.80665,minFlange:0.7*V,BA,BD,flat:A+B-BD};
}

function offsetCalc(hor,ver,ang,R){
  const off=Math.hypot(hor,ver), a=ang*Math.PI/180;
  const travel=off/Math.sin(a), run=off/Math.tan(a), take=R>0?R*Math.tan(a/2):0;
  return {off,travel,run,mult:1/Math.sin(a),take,cut:travel-2*take};
}
function pcd(n,D,start){
  const r=D/2;
  return Array.from({length:n},(_,i)=>{const a=start+360*i/n, rad=a*Math.PI/180;
    return {i:i+1,a:((a%360)+360)%360,x:r*Math.cos(rad),y:r*Math.sin(rad)};});
}
function tri(a,b,c,A){
  const ok=v=>isFinite(v)&&v>0, R=Math.PI/180;
  if(ok(a)&&ok(b)){c=Math.hypot(a,b);A=Math.atan2(a,b)/R;}
  else if(ok(a)&&ok(c)){if(c<=a)return null;b=Math.sqrt(c*c-a*a);A=Math.asin(a/c)/R;}
  else if(ok(b)&&ok(c)){if(c<=b)return null;a=Math.sqrt(c*c-b*b);A=Math.acos(b/c)/R;}
  else if(ok(A)&&A<90&&ok(a)){b=a/Math.tan(A*R);c=a/Math.sin(A*R);}
  else if(ok(A)&&A<90&&ok(b)){a=b*Math.tan(A*R);c=b/Math.cos(A*R);}
  else if(ok(A)&&A<90&&ok(c)){a=c*Math.sin(A*R);b=c*Math.cos(A*R);}
  else return null;
  return {a,b,c,A,B:90-A};
}
function segArea(r,h){
  h=Math.max(0,Math.min(2*r,h)); if(h<=0)return 0; if(h>=2*r)return Math.PI*r*r;
  return r*r*Math.acos((r-h)/r)-(r-h)*Math.sqrt(2*r*h-h*h);
}
function tank(type,p){
  let total,fill;
  if(type==='v'){const A=Math.PI*p.d*p.d/4;total=A*p.h;fill=A*Math.min(p.level,p.h);}
  else if(type==='h'){const r=p.d/2;total=Math.PI*r*r*p.h;fill=segArea(r,p.level)*p.h;}
  else{const A=p.w*p.l;total=A*p.h;fill=A*Math.min(p.level,p.h);}
  return {total:total/1e6,fill:fill/1e6};
}
function packCuts(stock,kerf,pieces){
  const sorted=pieces.slice().sort((a,b)=>b-a), bars=[];
  for(const p of sorted){
    let placed=false;
    for(const b of bars){
      const need=b.used+kerf+p;
      if(need<=stock+1e-9){b.items.push(p);b.used=need;placed=true;break;}
    }
    if(!placed)bars.push({items:[p],used:p});
  }
  return bars;
}
const UNITS={
  'Longitud':{base:'m',u:{mm:.001,cm:.01,m:1,km:1000,'pulg (in)':.0254,'pie (ft)':.3048,'yarda (yd)':.9144}},
  'Masa':{u:{g:.001,kg:1,'t (métrica)':1000,'libra (lb)':.45359237,'onza (oz)':.028349523125}},
  'Presión / tensión':{u:{Pa:1,kPa:1e3,MPa:1e6,bar:1e5,psi:6894.757293,ksi:6894757.293,'kgf/cm²':98066.5}},
  'Fuerza':{u:{N:1,kN:1000,kgf:9.80665,'lbf':4.4482216,'tonf (métrica)':9806.65}},
  'Par (torque)':{u:{'N·m':1,'kgf·m':9.80665,'lbf·ft':1.3558179,'lbf·in':.1129848}},
  'Área':{u:{'mm²':1e-6,'cm²':1e-4,'m²':1,'in²':6.4516e-4,'ft²':.09290304}},
  'Volumen':{u:{mL:.001,L:1,'m³':1000,'gal EE.UU.':3.785411784,'gal imp.':4.54609}}
};
function convert(cat,val,from){
  const u=UNITS[cat].u, base=val*u[from], out={};
  for(const k in u)out[k]=base/u[k];
  return out;
}

function stair(H,riserTarget,Lav){
  const n=Math.max(1,Math.round(H/riserTarget));
  const h=H/n, treads=n-1;
  const pp=(Lav>0&&treads>0)?Lav/treads:630-2*h;
  const run=treads*pp;
  return {n,h,treads,p:pp,run,ang:Math.atan2(h,pp)*180/Math.PI,zanca:n*Math.hypot(h,pp),paso:2*h+pp};
}
function dimsFor(shape,a,b,c){
  switch(shape){
    case 'flat':return {w:a,t:b};
    case 'round':return {d:a};
    case 'square':case 'hex':return {s:a};
    case 'tube':return {d:a,t:b};
    default:return {w:a,h:b,t:c};
  }
}
function lineKg(shape,a,b,c,L,q,rho){return massPerM(shape,dimsFor(shape,a,b,c),rho)*L/1000*q;}

function stairLanding(H,rt,n1,A,gap,type){
  const n=Math.max(2,Math.round(H/rt)), h=H/n;
  let a=Math.round(n1); if(!(a>=1&&a<=n-1)) a=Math.round(n/2);
  const b=n-a, p=Math.max(0,630-2*h), r1=(a-1)*p, r2=(b-1)*p, u=type==='u';
  return {n,h,p,a,b,landH:a*h,r1,r2,z1:a*Math.hypot(h,p),z2:b*Math.hypot(h,p),
    landW:A,landD:u?2*A+gap:A,footX:u?Math.max(r1,r2)+A:r1+A,footY:u?2*A+gap:A+r2,paso:2*h+p};
}
function stairSpiral(H,rt,D,dc,ang){
  const n=Math.max(2,Math.round(H/rt)), h=H/n, tr=n-1, R=Math.PI/180;
  const ro=D/2, ri=dc/2, rw=(ro+ri)/2, tot=tr*ang;
  return {n,h,tr,perTurn:360/ang,turns:tot/360,rw,pw:rw*ang*R,width:ro-ri,arcOut:ro*ang*R,arcIn:ri*ang*R,
    head:360/ang*h,walk:Math.hypot(rw*tot*R,H),rail:Math.hypot(ro*tot*R,H)};
}
function stairSteep(H,rt,ang){
  const n=Math.max(1,Math.round(H/rt)), h=H/n, p=h/Math.tan(ang*Math.PI/180), tr=n-1, run=tr*p;
  return {n,h,p,tr,run,zanca:n*Math.hypot(h,p)};
}
function ladderV(H,s,ext){
  const n=Math.max(1,Math.round(H/s));
  return {n,sp:H/n,rungs:n-1,rail:H+ext};
}

function barWidth(shape,a,b,orient){return shape==='flat'?(orient==='canto'?b:a):a;}
function rejaCalc(Wc,H,fw,b,mode,gmax,nIn){
  const inner=Wc-2*fw, Lb=H-2*fw;
  const n=mode==='n'?Math.max(0,Math.min(300,Math.round(nIn))):Math.max(0,Math.ceil((inner-gmax)/(b+gmax)-1e-9));
  const g=(inner-n*b)/(n+1);
  return {inner,Lb,n,g,pitch:g+b};
}
/*CALC-END*/

}
const TOOLS=[
{id:'peso',name:'Peso de materiales',desc:'Chapa, barra, caño, perfil L',
 fig:()=>FIG.peso(V('shape')),
 html:()=>`<div class="form">
  ${sel('mat','Material',MAT,'acero','','full')}
  ${sel('shape','Forma',[['flat','Chapa / planchuela'],['round','Barra redonda'],['square','Barra cuadrada'],['hex','Barra hexagonal'],['tube','Caño redondo'],['rect','Caño rectangular'],['angle','Perfil L (ángulo)']],'flat','','full')}
  ${fld('w','Ancho','100','mm')}${fld('h','Alto','100','mm')}${fld('t','Espesor','10','mm')}${fld('d','Diámetro','50','mm')}${fld('s','Lado','30','mm')}${fld('l','Largo','1000','mm')}
  ${fld('qty','Cantidad','1','u.')}${fld('price','Precio por kg (opcional)','','$')}
  <p class="hint">Los caños y perfiles se calculan con esquinas vivas, sin radios de laminado.</p></div><div id="out"></div>`,
 calc(){
  const LAB={flat:{w:'Ancho',t:'Espesor',l:'Largo'},round:{d:'Diámetro',l:'Largo'},square:{s:'Lado',l:'Largo'},hex:{s:'Entre caras',l:'Largo'},tube:{d:'Diámetro exterior',t:'Espesor de pared',l:'Largo'},rect:{w:'Ancho',h:'Alto',t:'Espesor de pared',l:'Largo'},angle:{w:'Ala A',h:'Ala B',t:'Espesor',l:'Largo'}};
  const shape=V('shape'), lab=LAB[shape];
  ['w','h','t','d','s','l'].forEach(k=>{const el=document.getElementById(k).closest('.f');el.hidden=!(k in lab);if(k in lab)document.getElementById('lab-'+k).textContent=lab[k];});
  const p={w:N('w'),h:N('h'),t:N('t'),d:N('d'),s:N('s')}, L=N('l'), q=N('qty')||1, rho=RHO[V('mat')];
  const need2=Object.keys(lab).filter(k=>k!=='l').map(k=>p[k]);
  if(!pos(L,...need2)) return $('#out').innerHTML=need;
  const A=crossArea(shape,p);
  if(!isFinite(A)||A<=0) return $('#out').innerHTML='<p class="msg">El espesor de pared es demasiado grande para esa medida.</p>';
  const pm=A*1e-6*rho, piece=pm*L/1000, total=piece*q, price=N('price');
  $('#out').innerHTML=res(
    row('Peso total',fmt(total,2),'kg','key')+
    row('Peso por metro',fmt(pm,3),'kg/m')+
    row('Peso por pieza',fmt(piece,3),'kg')+
    row('Peso total en libras',fmt(total*2.20462262,2),'lb')+
    row('Área de la sección',fmt(A,1),'mm²')+
    (shape==='flat'?row('Superficie de una cara (por pieza)',fmt(p.w*L/1e6,3),'m²'):'')+
    (price>0?row('Costo del material',fmt(total*price,2),'$'):'')
  );
 }},

 html:()=>{
  const n=matN||(+store('mats').mrows)||3; matN=n;
  const dflt=[['flat',100,10,'',1000,2],['rect',40,40,2,6000,3],['angle',50,50,5,6000,1]];
  const rows=Array.from({length:n},(_,i)=>{const d=dflt[i]||['flat','','','','',''];
    return `<div class="mrow"><h3 class="sec" style="margin:0">Pieza ${i+1}</h3>
    ${sel('m'+i+'s','Forma',SHAPES,d[0],'','full')}
    ${fld('m'+i+'a','Medida 1',d[1],'mm')}${fld('m'+i+'b','Medida 2',d[2],'mm')}${fld('m'+i+'c','Medida 3',d[3],'mm')}
    ${fld('m'+i+'l','Largo',d[4],'mm')}${fld('m'+i+'q','Cantidad',d[5],'u.')}</div>`;}).join('');
  return `<div class="form">
  ${sel('mat','Material',MAT,'acero','','full')}
  ${fld('mw','Desperdicio y recortes','10','%')}${fld('price','Precio por kg (opcional)','','$')}
  ${rows}
  <div class="full btns"><button type="button" class="back" onclick="matRows(1)">+ Agregar pieza</button><button type="button" class="back" onclick="matRows(-1)">Quitar última</button></div>
  </div><div id="out"></div>`;},
 calc(){
  const n=matN||3, LAB={flat:['Ancho','Espesor'],round:['Diámetro'],square:['Lado'],hex:['Entre caras'],tube:['Diámetro exterior','Pared'],rect:['Ancho','Alto','Pared'],angle:['Ala A','Ala B','Espesor']};
  const rho=RHO[V('mat')], names=Object.fromEntries(SHAPES), lines=[]; let net=0;
  for(let i=0;i<n;i++){
    const sh=V('m'+i+'s'), lab=LAB[sh];
    ['a','b','c'].forEach((k,j)=>{const el=document.getElementById('m'+i+k).closest('.f');el.hidden=j>=lab.length;if(j<lab.length)document.getElementById('lab-m'+i+k).textContent=lab[j];});
    const a=N('m'+i+'a'),b=N('m'+i+'b'),c=N('m'+i+'c'),L=N('m'+i+'l'),q=N('m'+i+'q');
    const dims=[a,b,c].slice(0,lab.length);
    if(!pos(L,q,...dims))continue;
    const kg=lineKg(sh,a,b,c,L,q,rho);
    if(isFinite(kg)&&kg>0){net+=kg;lines.push(row(`Pieza ${i+1}: ${names[sh]}, ${fmt(q,0)} × ${fmt(L,0)} mm`,fmt(kg,2),'kg'));}
  }
  if(!lines.length) return $('#out').innerHTML=need;
  const w=N('mw')||0, buy=net*(1+w/100), price=N('price');
  $('#out').innerHTML=res(
    row('Peso a comprar',fmt(buy,1),'kg','key')+
    row('Peso neto de las piezas',fmt(net,1),'kg')+
    row('Con desperdicio del '+fmt(w,1)+' %',fmt(buy-net,1),'kg de recortes')+
    (price>0?row('Costo estimado',fmt(buy*price,2),'$'):'')+
    lines.join(''));
 }},

{id:'reja',name:'Reja y baranda',desc:'Separación de barrotes y peso',
 fig:()=>FIG.reja(),
 html:()=>`<div class="form">
  ${sel('jm','Calcular por',[['g','Separación libre máxima'],['n','Cantidad de barrotes']],'g','','full')}
  ${fld('jw','Ancho total del vano','1200','mm')}${fld('jh','Alto total','1000','mm')}
  ${fld('jg','Separación libre máxima permitida','100','mm')}${fld('jn','Cantidad de barrotes','8','u.')}
  ${sel('jmat','Material',MAT,'acero','','full')}
  <h3 class="sec">Barrotes</h3>
  ${sel('jbs','Forma',[['square','Barra cuadrada'],['round','Barra redonda'],['flat','Planchuela'],['tube','Caño redondo'],['rect','Caño rectangular']],'square','','full')}
  ${fld('jba','Lado','12','mm')}${fld('jbb','Medida 2','','mm')}${fld('jbc','Medida 3','','mm')}
  ${sel('jbo','Planchuela colocada',[['plano','De plano (se ve el ancho)'],['canto','De canto (se ve el espesor)']],'plano','','full')}
  <h3 class="sec">Marco</h3>
  ${sel('jfs','Sección del marco',[['rect','Caño cuadrado o rectangular'],['flat','Planchuela'],['angle','Perfil L'],['none','Sin marco']],'rect','','full')}
  ${fld('jfa','Ancho visible','40','mm')}${fld('jfb','Alto','40','mm')}${fld('jfc','Pared','2','mm')}
  ${fld('jp','Precio por kg (opcional)','','$')}
  <p class="hint">Los barrotes van entre el marco de arriba y el de abajo, con la misma separación libre contra los costados. El marco se calcula con uniones a tope, sin pérdidas por corte.</p></div><div id="out"></div>`,
 calc(){
  const hide=(id,c)=>{document.getElementById(id).closest('.f').hidden=c;};
  const LABB={square:['Lado'],round:['Diámetro'],flat:['Ancho','Espesor'],tube:['Diámetro exterior','Pared'],rect:['Ancho','Alto','Pared']};
  const LABF={rect:['Ancho visible','Alto','Pared'],flat:['Ancho visible','Espesor'],angle:['Ala visible','Otra ala','Espesor'],none:[]};
  const DEFB={square:[12],round:[12],flat:[25,5],tube:[20,2],rect:[20,20,2]}, DEFF={rect:[40,40,2],flat:[40,6],angle:[40,40,4],none:[]};
  const sync=(sid,pfx,def)=>{const el=document.getElementById(sid);if(!el.dataset.s){el.dataset.s=el.value;return;}if(el.dataset.s===el.value)return;el.dataset.s=el.value;const d=def[el.value]||[];['a','b','c'].forEach((k,i)=>{document.getElementById(pfx+k).value=d[i]==null?'':d[i];});};
  sync('jbs','jb',DEFB); sync('jfs','jf',DEFF);
  const bs=V('jbs'), fs=V('jfs'), mode=V('jm'), lb=LABB[bs], lf=LABF[fs];
  ['a','b','c'].forEach((k,i)=>{
    hide('jb'+k,i>=lb.length); if(i<lb.length)document.getElementById('lab-jb'+k).textContent=lb[i];
    hide('jf'+k,i>=lf.length); if(i<lf.length)document.getElementById('lab-jf'+k).textContent=lf[i];
  });
  hide('jbo',bs!=='flat'); hide('jn',mode!=='n');
  const W=N('jw'),H=N('jh'),gmax=N('jg'),nIn=N('jn'),a=N('jba'),b=N('jbb'),c=N('jbc'),fa=N('jfa'),fb=N('jfb'),fc=N('jfc');
  const dimsB=[a,b,c].slice(0,lb.length), dimsF=[fa,fb,fc].slice(0,lf.length);
  if(!pos(W,H,gmax,...dimsB,...dimsF)||(mode==='n'&&!(nIn>=0))) return $('#out').innerHTML=need;
  const fw=fs==='none'?0:fa, bw=barWidth(bs,a,b,V('jbo')), rho=RHO[V('jmat')];
  const r=rejaCalc(W,H,fw,bw,mode,gmax,nIn);
  if(!(r.inner>0)||!(r.Lb>0)) return $('#out').innerHTML='<p class="msg">El marco ocupa todo el vano. Reducí su ancho visible.</p>';
  if(r.g<0) return $('#out').innerHTML='<p class="msg">Los barrotes no entran en ese ancho. Reducí la cantidad o su medida.</p>';
  const kgB=lineKg(bs,a,b,c,r.Lb,r.n,rho), kgF=fs==='none'?0:lineKg(fs,fa,fb,fc,2*W+2*r.Lb,1,rho), tot=kgB+kgF, price=N('jp');
  if(!isFinite(tot)) return $('#out').innerHTML='<p class="msg">El espesor de pared es demasiado grande para esa medida.</p>';
  const ALT=[['acero','acero al carbono'],['inox304','inoxidable 304'],['alu','aluminio'],['laton','latón']].filter(x=>x[0]!==V('jmat'));
  $('#out').innerHTML=res(
    row('Cantidad de barrotes',r.n,'u.','key')+
    row('Separación libre entre barrotes',fmt(r.g,1),'mm',r.g>gmax+1e-9?'bad':'good')+
    row('Separación entre ejes',fmt(r.pitch,1),'mm')+
    row('Largo de cada barrote',fmt(r.Lb,0),'mm')+
    row('Largo total de barrotes',fmt(r.n*r.Lb/1000,2),'m')+
    row('Peso de los barrotes',fmt(kgB,2),'kg')+
    (fs!=='none'?row('Peso del marco',fmt(kgF,2),'kg'):'')+
    row('Peso total',fmt(tot,2),'kg')+
    (price>0?row('Costo del material',fmt(tot*price,2),'$'):'')+
    ALT.map(x=>row('Si fuera de '+x[1],fmt(tot*RHO[x[0]]/rho,2),'kg')).join('')
  )+'<p class="note">La separación libre máxima que se exige en rejas y barandas depende del reglamento de tu zona. Un valor habitual para que no pase un niño es 100 mm. Verificá antes de fabricar.</p>';
 }},

{id:'viga',name:'Viga apoyada',desc:'Flexión, corte y flecha',
 fig:()=>FIG.viga(),
 html:()=>`<div class="form">
  ${sel('sec','Sección',IPE.map((r,i)=>[i,r[0]]).concat([['rect','Rectangular maciza'],['round','Redonda maciza'],['tubeR','Caño redondo'],['custom','Propiedades propias']]),6,'','full')}
  ${fld('sb','Base b','50','mm','rect')}${fld('sh','Alto h','100','mm','rect')}${fld('sd','Diámetro','40','mm','round')}
  ${fld('sD','Diámetro exterior','88.9','mm','tubeR')}${fld('st','Espesor de pared','4','mm','tubeR')}
  ${fld('cI','Inercia Ix','1943','cm⁴','custom')}${fld('cW','Módulo resistente Wx','194','cm³','custom')}${fld('cm','Masa','22.4','kg/m','custom')}${fld('cAv','Área de corte (opcional)','','cm²','custom')}
  <h3 class="sec">Cargas y condiciones</h3>
  ${fld('L','Luz entre apoyos','4','m')}${fld('w','Carga distribuida','10','kN/m')}
  ${fld('P','Carga puntual al centro','0','kN')}${sel('fy','Acero',[[235,'S235 (235 MPa)'],[275,'S275 (275 MPa)'],[355,'S355 (355 MPa)']],235)}
  ${sel('lim','Flecha admisible',[[250,'L/250'],[300,'L/300'],[360,'L/360'],[400,'L/400'],[500,'L/500']],300)}${sel('sw','Peso propio',[[1,'Sumarlo'],[0,'Ya incluido']],1)}
  <p class="hint">Cargas de servicio, sin mayorar. Se compara la tensión con el límite elástico. No incluye pandeo lateral ni abolladura.</p></div><div id="out"></div>`,
 calc(){
  const s=V('sec'); $$('[data-g]').forEach(e=>e.hidden=e.dataset.g!==(isNaN(+s)?s:'none'));
  let sec=null, name='';
  if(!isNaN(+s)){sec=ipeSec(IPE[+s]);name=IPE[+s][0];}
  else if(s==='rect'){const b=N('sb'),h=N('sh');if(pos(b,h))sec={I:b*h*h*h/12,W:b*h*h/6,Av:b*h,mass:b*h*1e-6*7850};}
  else if(s==='round'){const d=N('sd');if(pos(d))sec={I:Math.PI*Math.pow(d,4)/64,W:Math.PI*d*d*d/32,Av:Math.PI*d*d/4,mass:Math.PI*d*d/4*1e-6*7850};}
  else if(s==='tubeR'){const D=N('sD'),t=N('st');if(pos(D,t)&&D>2*t){const dd=D-2*t,A=Math.PI/4*(D*D-dd*dd);sec={I:Math.PI/64*(Math.pow(D,4)-Math.pow(dd,4)),W:Math.PI/32*(Math.pow(D,4)-Math.pow(dd,4))/D,Av:2*A/Math.PI,mass:A*1e-6*7850};}}
  else if(s==='custom'){const I=N('cI'),W=N('cW'),m=N('cm'),av=N('cAv');if(pos(I,W,m))sec={I:I*1e4,W:W*1e3,Av:av>0?av*100:0,mass:m};}
  const L=N('L'),w=N('w')||0,P=N('P')||0,fy=+V('fy'),lim=+V('lim'),sw=V('sw')==='1';
  if(!sec||!pos(L)||(w<=0&&P<=0)) return $('#out').innerHTML=need;
  const c=beamCheck(sec,L,w,P,fy,lim,sw);
  let best='';
  if(!isNaN(+s)){const f=IPE.find(r=>beamCheck(ipeSec(r),L,w,P,fy,lim,sw).ok);best=f?f[0]:'ninguno de la lista';}
  $('#out').innerHTML=res(
    row(c.ok?'Resultado':'Resultado',c.ok?'CUMPLE':'NO CUMPLE','',(c.ok?'good':'bad')+' key')+
    utilRow('Flexión',c.uM,`${fmt(c.sigma,0)} / ${fy} MPa`)+
    utilRow('Corte',c.uV,isFinite(c.tau)?`${fmt(c.tau,0)} MPa`:'sin dato')+
    utilRow('Flecha',c.uD,`${fmt(c.d,1)} de ${fmt(c.dl,1)} mm`)+
    row('Momento máximo',fmt(c.M,2),'kN·m')+
    row('Reacción en cada apoyo',fmt(c.V,2),'kN')+
    row('Carga distribuida total',fmt(c.q,3),'kN/m')+
    row('Relación luz / flecha','L/'+fmt(c.d>0?L*1000/c.d:Infinity,0))+
    (best?row('IPE más liviano que cumple',best,''):'')
  );
 }},

{id:'escalera',name:'Escaleras',desc:'Recta, descanso, caracol, marinera, gato',
 fig:()=>FIG.escalera(V('et')),
 html:()=>`<div class="form">
  ${sel('et','Tipo de escalera',[['r','Recta'],['l','Con descanso en L (90°)'],['u','Con descanso en U (180°)'],['c','Caracol (helicoidal)'],['m','Marinera (muy inclinada)'],['g','De gato (vertical)']],'r','','full')}
  ${fld('eh','Altura total a salvar (piso a piso)','2800','mm')}
  ${fld('er','Contrahuella deseada','175','mm','r l u c m')}
  ${fld('es','Separación deseada entre peldaños','300','mm','g')}
  ${fld('el','Espacio horizontal disponible (opcional)','','mm','r')}
  ${fld('ea','Ancho de la escalera','900','mm','r l u')}
  ${fld('en1','Escalones hasta el descanso (opcional)','','u.','l u')}
  ${fld('eq','Hueco entre tramos','100','mm','u')}
  ${fld('ed','Diámetro exterior','1600','mm','c')}
  ${fld('ec','Diámetro de la columna central','100','mm','c')}
  ${fld('eang','Ángulo de cada escalón','22.5','°','c')}
  ${fld('em','Ángulo de inclinación','60','°','m')}
  ${fld('ew','Ancho entre laterales','450','mm','g')}
  ${fld('ex','Prolongación sobre el nivel superior','1000','mm','g')}
  <p class="hint" id="ehint"></p></div><div id="out"></div><details class="gloss" id="egloss"></details>`,
 calc(){
  const t=V('et'); $$('[data-g]').forEach(e=>e.hidden=!e.dataset.g.split(' ').includes(t));
  const HINT={
   r:'Si no cargás el espacio horizontal, la huella se calcula con la regla del paso: 2 × contrahuella + huella = 630 mm.',
   l:'El descanso cuenta como un peldaño más. La huella sale de la regla del paso (2 × contrahuella + huella = 630 mm). Si no indicás los escalones hasta el descanso, se reparten por la mitad.',
   u:'El descanso cuenta como un peldaño más. La huella sale de la regla del paso (2 × contrahuella + huella = 630 mm). Si no indicás los escalones hasta el descanso, se reparten por la mitad.',
   c:'La huella se mide sobre la línea de paso, a mitad del ancho útil entre la columna y el borde exterior. Un ángulo habitual por escalón va de 20° a 30°.',
   m:'Pendiente alta, usual para accesos a entrepisos técnicos o salas de máquinas. Se sube de frente y con pasamanos.',
   g:'El último peldaño queda a una separación del nivel superior y los laterales siguen hacia arriba para agarrarse. A cierta altura suele exigirse aro de protección: verificá el reglamento.'};
  $('#ehint').textContent=HINT[t];
  const GD={
   contra:['Contrahuella','Altura vertical de cada escalón: la parte de adelante que sube de un peldaño al siguiente.'],
   huella:['Huella','Profundidad del escalón: la parte horizontal donde se apoya el pie.'],
   peldano:['Peldaño','La pieza horizontal sobre la que se pisa. En la escalera de gato es el travesaño.'],
   zanca:['Zanca','Viga inclinada que sostiene los peldaños. Se usa una a cada lado o una central. Su largo va de un piso al otro.'],
   altura:['Altura total','Desnivel entre el piso de salida y el piso de llegada.'],
   recorrido:['Recorrido horizontal','Distancia horizontal que ocupa la escalera, entre el primer y el último escalón.'],
   incl:['Inclinación','Ángulo de la escalera respecto de la horizontal.'],
   paso:['Regla del paso','Suma de dos contrahuellas más una huella. Entre 600 y 640 mm da un paso cómodo.'],
   desc:['Descanso','Plataforma plana intermedia donde la escalera cambia de dirección. Cuenta como un peldaño.'],
   hueco:['Hueco entre tramos','Espacio libre entre los dos tramos de una escalera en U.'],
   col:['Columna central','Tubo vertical donde se fijan los escalones de un caracol.'],
   lp:['Línea de paso','Recorrido imaginario de quien sube, a mitad del ancho útil. Sobre esa línea se mide la huella.'],
   util:['Ancho útil','Espacio entre la columna y el borde exterior donde se pisa.'],
   ang:['Ángulo por escalón','Cuánto gira cada escalón alrededor de la columna. 360° dividido ese ángulo da los escalones por vuelta.'],
   libre:['Altura libre','Distancia vertical entre un escalón y el que queda justo encima, una vuelta después. Evita golpes en la cabeza.'],
   lat:['Lateral','Cada uno de los dos perfiles verticales de una escalera de gato, donde se sueldan los peldaños.'],
   prol:['Prolongación','Parte de los laterales que sobresale del nivel superior para agarrarse al subir y bajar.'],
   sep:['Separación','Distancia de centro a centro entre dos peldaños de una escalera de gato.']};
  const GL={r:['contra','huella','peldano','zanca','altura','recorrido','incl','paso'],
   l:['contra','huella','zanca','desc','altura','paso'],u:['contra','huella','zanca','desc','hueco','altura','paso'],
   c:['contra','huella','col','lp','util','ang','libre','altura'],m:['contra','huella','zanca','altura','incl'],g:['peldano','sep','lat','prol','altura']};
  const gd=document.getElementById('egloss');
  if(gd.dataset.t!==t){gd.dataset.t=t;gd.innerHTML='<summary>Qué significa cada término</summary><dl>'+GL[t].map(k=>`<div><dt>${GD[k][0]}</dt><dd>${GD[k][1]}</dd></div>`).join('')+'</dl>';}
  const H=N('eh'), R=N('er');
  const REF='<p class="note">Referencias habituales: contrahuella de 150 a 190 mm, huella de 250 a 320 mm y paso de 600 a 640 mm. Los valores en naranja quedan fuera de ese rango. Verificá con el reglamento de tu zona. Las medidas son a eje del escalón, sin espesor de peldaño.</p>';
  const out=h=>$('#out').innerHTML=h;
  if(t==='g'){
    const S=N('es'),W=N('ew'),X=N('ex')||0;
    if(!pos(H,S,W)) return out(need);
    const r=ladderV(H,S,X);
    return out(res(
      row('Cantidad de peldaños',r.rungs,'u.','key')+
      row('Separación real entre peldaños',fmt(r.sp,1),'mm',r.sp<250||r.sp>300?'warn':'')+
      row('Largo de cada lateral',fmt(r.rail,0),'mm')+
      row('Largo de cada peldaño',fmt(W,0),'mm')+
      row('Altura hasta el nivel superior',fmt(H,0),'mm')
    )+'<p class="note">El primer peldaño queda a una separación del piso y el último a una separación del nivel superior. Referencia habitual de separación: 250 a 300 mm. Verificá con el reglamento si hace falta protección (aro) y a qué altura.</p>');
  }
  if(t==='c'){
    const D=N('ed'),dc=N('ec'),ang=N('eang');
    if(!pos(H,R,D,dc,ang)||dc>=D||ang>90) return out(need);
    const r=stairSpiral(H,R,D,dc,ang);
    return out(res(
      row('Escalones (contrahuellas)',r.n,'u.','key')+
      row('Altura de cada contrahuella',fmt(r.h,1),'mm',r.h<150||r.h>220?'warn':'')+
      row('Escalones por vuelta',fmt(r.perTurn,1),'u.')+
      row('Vueltas totales',fmt(r.turns,2))+
      row('Huella en la línea de paso',fmt(r.pw,0),'mm')+
      row('Ancho útil (columna a borde)',fmt(r.width,0),'mm')+
      row('Ancho del escalón en el borde exterior',fmt(r.arcOut,0),'mm')+
      row('Ancho del escalón en el borde interior',fmt(r.arcIn,0),'mm')+
      row('Altura libre entre vueltas',fmt(r.head,0),'mm',r.head<2000?'bad':'good')+
      row('Largo de la línea de paso',fmt(r.walk,0),'mm')+
      row('Largo del barandal exterior',fmt(r.rail,0),'mm')
    )+'<p class="note">En el caracol la regla del paso no se aplica igual que en una escalera recta. La altura libre entre vueltas debería ser de al menos 2000 mm para no golpearse la cabeza; descontá el espesor del peldaño. Verificá con el reglamento de tu zona.</p>');
  }
  if(t==='m'){
    const ang=N('em');
    if(!pos(H,R,ang)||ang>=90) return out(need);
    const r=stairSteep(H,R,ang);
    return out(res(
      row('Escalones (contrahuellas)',r.n,'u.','key')+
      row('Altura de cada contrahuella',fmt(r.h,1),'mm',r.h>250?'warn':'')+
      row('Huella (profundidad del escalón)',fmt(r.p,1),'mm')+
      row('Cantidad de huellas o peldaños',r.tr,'u.')+
      row('Inclinación',fmt(ang,1),'°',ang<50||ang>75?'warn':'')+
      row('Recorrido horizontal total',fmt(r.run,0),'mm')+
      row('Longitud de la zanca',fmt(r.zanca,0),'mm')
    )+'<p class="note">Una inclinación de 50° a 75° es lo habitual en escaleras marineras. Fuera de ese rango conviene usar una escalera recta o una de gato. Verificá con el reglamento de tu zona.</p>');
  }
  if(t==='l'||t==='u'){
    const A=N('ea'),gap=N('eq')||0,n1=N('en1');
    if(!pos(H,R,A)) return out(need);
    const r=stairLanding(H,R,n1,A,gap,t), okPaso=r.paso>=600&&r.paso<=640;
    return out(res(
      row('Escalones totales',r.n,'u.','key')+
      row('Altura de cada contrahuella',fmt(r.h,1),'mm',r.h<150||r.h>190?'warn':'')+
      row('Huella (profundidad del escalón)',fmt(r.p,1),'mm',r.p<250||r.p>320?'warn':'')+
      row('Escalones del tramo 1',r.a,'u.')+
      row('Escalones del tramo 2',r.b,'u.')+
      row('Altura del descanso',fmt(r.landH,0),'mm')+
      row('Medida del descanso',fmt(r.landW,0)+' × '+fmt(r.landD,0),'mm')+
      row('Zanca del tramo 1',fmt(r.z1,0),'mm')+
      row('Zanca del tramo 2',fmt(r.z2,0),'mm')+
      row('Ocupa en planta',fmt(r.footX,0)+' × '+fmt(r.footY,0),'mm')+
      row('Regla del paso (2 × contr. + huella)',fmt(r.paso,0),'mm',okPaso?'good':'warn')
    )+REF);
  }
  const Lav=N('el'),A=N('ea');
  if(!pos(H,R)) return out(need);
  const r=stair(H,R,Lav), okPaso=r.paso>=600&&r.paso<=640, okAng=r.ang>=20&&r.ang<=42;
  out(res(
    row('Escalones (contrahuellas)',r.n,'u.','key')+
    row('Altura de cada contrahuella',fmt(r.h,1),'mm',r.h<150||r.h>190?'warn':'')+
    row('Huella (profundidad del escalón)',fmt(r.p,1),'mm',r.p<250||r.p>320?'warn':'')+
    row('Cantidad de huellas o peldaños',r.treads,'u.')+
    (isFinite(A)&&A>0?row('Largo de cada peldaño',fmt(A,0),'mm'):'')+
    row('Recorrido horizontal total',fmt(r.run,0),'mm')+
    row('Longitud de la zanca',fmt(r.zanca,0),'mm')+
    row('Inclinación',fmt(r.ang,1),'°',okAng?'':'warn')+
    row('Regla del paso (2 × contr. + huella)',fmt(r.paso,0),'mm',okPaso?'good':'warn')
  )+REF);
 }},

 calc(){

{id:'corte',name:'Lista de corte',desc:'Barras necesarias y sobrante',
 fig:()=>FIG.corte(),
 html:()=>`<div class="form">
  ${fld('cs','Largo de la barra','6000','mm')}${fld('ck','Espesor del corte (disco)','3','mm')}
  <label class="f full" for="cp"><span>Piezas: largo × cantidad, una por línea</span><div class="in"><textarea id="cp" spellcheck="false">1200 x 4
850 x 6
430 x 8
2100 x 2</textarea></div></label></div><div id="out"></div>`,
 calc(){
  const S=N('cs'),k=N('ck')||0, pieces=[], bad=[];
  V('cp').split('\n').forEach(line=>{
    if(!line.trim())return;
    const m=line.trim().match(/^([\d.,]+)\s*(?:[x×*]\s*(\d+))?$/i);
    if(!m){bad.push(line.trim());return;}
    const len=parseFloat(m[1].replace(',','.')), q=Math.min(500,m[2]?+m[2]:1);
    if(!(len>0)){bad.push(line.trim());return;}
    for(let i=0;i<q;i++)pieces.push(len);
  });
  if(!pos(S)||!pieces.length) return $('#out').innerHTML=need;
  const big=pieces.filter(p=>p>S);
  if(big.length) return $('#out').innerHTML=`<p class="msg">Hay piezas más largas que la barra (${fmt(Math.max(...big),0)} mm).</p>`;
  const bars=packCuts(S,k,pieces), used=pieces.reduce((a,b)=>a+b,0), mat=bars.length*S;
  $('#out').innerHTML=res(
    row('Barras necesarias',bars.length,'u.','key')+
    row('Piezas a cortar',pieces.length,'u.')+
    row('Aprovechamiento',fmt(used/mat*100,1),'%')+
    row('Sobrante total',fmt(mat-used,0),'mm')
  )+`<div class="bars">${bars.map((b,i)=>`<div><div class="barlab"><span>Barra ${i+1}</span><span>sobrante ${fmt(S-b.used,0)} mm</span></div><div class="bar">${b.items.map((x,j)=>`<span class="seg p${j%2}" style="width:${x/S*100}%">${fmt(x,0)}</span>`).join('')}</div></div>`).join('')}</div>`+
  (bad.length?`<p class="note">No se entendió: ${bad.join(' | ')}</p>`:'');
 }},

/* ---------- navegación ---------- */
const main=$('#main'), back=$('#back'), brand=$('#brand');
const MEM={};
function store(id){if(MEM[id])return MEM[id];try{return JSON.parse(localStorage.getItem('ta:'+id)||'{}');}catch(e){return {};}}
function save(id){const o=Object.assign({},store(id));$$('#main input,#main select,#main textarea').forEach(e=>{if(e.id)o[e.id]=e.value;});persist(id,o);}
function home(){
  document.title='Taller Acero';
  back.hidden=true; brand.hidden=false;
  main.className='view';
  main.innerHTML=`<p class="lead">${TOOLS.length} calculadoras para el taller y la obra. Funcionan sin conexión y no piden registro.</p><div class="grid">${TOOLS.map(t=>`<a class="tile" href="#${t.id}"><svg viewBox="0 0 24 24" aria-hidden="true">${ICON[t.id==='conv'?'conv':t.id]}</svg><h2>${t.name}</h2><p>${t.desc}</p></a>`).join('')}</div>`;
  window.scrollTo(0,0);
}
function openTool(t){
  document.title=t.name+' · Taller Acero';
  back.hidden=false; brand.hidden=true;
  main.className='view';
  main.innerHTML=`<h1 class="tt">${t.name}</h1><p class="sub">${t.desc}</p>`+(t.fig?'<figure class="fig" id="fig"></figure>':'')+t.html();
  const saved=store(t.id);
  Object.keys(saved).forEach(k=>{const e=document.getElementById(k);if(e&&!(e.tagName==='SELECT'&&!Array.from(e.options).some(o=>o.value===saved[k])&&e.options.length))e.value=saved[k];});
  const run=()=>{if(t.fig){try{$('#fig').innerHTML=t.fig();}catch(e){}}try{t.calc();}catch(e){$('#out').innerHTML='<p class="msg">No se pudo calcular con esos datos.</p>';}};
  main.oninput=main.onchange=()=>{run();save(t.id);};
  run();
  window.scrollTo(0,0);
}
function route(){
  const id=location.hash.replace('#','');
  const t=TOOLS.find(x=>x.id===id);
  t?openTool(t):home();
}
back.addEventListener('click',()=>{location.hash='';});
window.addEventListener('hashchange',route);
route();
</script>
<script>
if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>
